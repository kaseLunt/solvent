  /v1/prices/{asset}:
    get:
      tags: [prices]
      operationId: getPriceHistory
      summary: Custodied price observations for one asset, with validity and provenance
      description: |
        The retained price ledger for one asset address, grouped into one
        series per (chain_id, source) key. Every row carries its own validity
        verdict: quarantined rows (`valid: false`) are RETAINED and SERVED with
        their reasons — a quarantine is evidence, not garbage — and each series
        summarizes its quarantined block ranges so a renderer cannot miss them.

        Downsampling (`step`) never averages: each returned point is an exact
        custodied row, taken every `step` blocks. In particular no served value
        is ever synthesized across a VALIDITY BOUNDARY — a quarantined
        observation never contributes to a valid-looking point, and a
        valid-invalid-valid sequence downsamples to exact rows from each
        segment, never to a blend that papers over the quarantine.

        `source_as_of` is the chain-asserted as-of. Database insert time is
        never substituted; a row with no as-of says so with null.
      parameters:
        - name: asset
          in: path
          required: true
          description: The asset's address. Strictly validated; a malformed address is a 400.
          schema:
            type: string
            pattern: "^0[xX][0-9a-fA-F]{40}$"
        - name: source
          in: query
          required: false
          description: Restrict to one price source key, verbatim (e.g. `aaveoracle:0x...`, `priceproviderv2`, `chainlink:0x...`).
          schema: { type: string }
        - name: from_block
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
        - name: to_block
          in: query
          required: false
          schema: { type: integer, format: int64, minimum: 0 }
        - name: step
          in: query
          required: false
          description: Block stride. Serves every row whose block clears the previous served row by at least `step` — exact rows, never averages.
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: The asset's price series, one per (chain, source) key.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PricesResponse" }
              example:
                served_at: "2026-07-29T10:00:05Z"
                asset: "0xCd5fE23C85820F7B72D0926FC9b05b43E359b7ee"
                source: null
                from_block: 25635500
                to_block: null
                step: null
                chains: [1, 10]
                series:
                  - chain_id: 1
                    asset: "0xCd5fE23C85820F7B72D0926FC9b05b43E359b7ee"
                    symbol: "weETH"
                    source: "aaveoracle:0x43b64f28a678944e0655404b0b98e443851cc34f"
                    owner_engine: "aave_v3_etherfi"
                    provenance: "adapter-output"
                    decimals: 8
                    points:
                      - block_number: 25635550
                        value: "399800000000"
                        anchor_block: null
                        source_as_of: "2026-07-29T09:44:30Z"
                        valid: false
                        invalid_reason: "unverifiable after a reorg: no surviving poll anchor covers this observation"
                      - block_number: 25635610
                        value: "400000000000"
                        anchor_block: 25635609
                        source_as_of: "2026-07-29T09:56:30Z"
                        valid: true
                        invalid_reason: ""
                    quarantined_ranges:
                      - from_block: 25635550
                        to_block: 25635550
                        rows: 1
                        reasons:
                          - key: "unverifiable after a reorg: no surviving poll anchor covers this observation"
                            count: 1
                    note: "quarantined rows are retained and served with their reasons; they are never deleted and never smoothed into the valid series."
                notes:
                  - "an asset with no custodied observations answers with an empty `series` — an ANSWER about custody, not a claim that the asset has no price."
                  - "downsampling serves exact rows and never averages, least of all across a validity boundary."
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/scenarios:
    get:
      tags: [scenarios]
      operationId: getScenarios
      summary: The committed scenario set — the definitions themselves, servable cold
      description: |
        The COMMITTED scenario set as definitions: what each scenario shocks, on
        which primitive axes, for which engines, under which path assumption,
        and what it explicitly does NOT model.

        This is CONFIGURATION, not batch data — the set is compiled into the
        binary — so the response carries **no batch envelope** and answers 200
        with no servable batch in the database at all. That is the point of the
        route: the same definitions ride on every `/v1/address/{addr}/stress`
        response, but reading them from there requires naming an address and
        asking what would happen to it, and that route answers 503 before the
        materializer's first pass. A client rendering scenario controls needs the
        vocabulary, not a verdict about somebody's position.

        `engines` is the set of engines a scenario is DEFINED for. An engine
        absent from it is outside the scenario's model — a property of the
        definition, and NOT the same statement as a withheld engine, which is a
        refusal and is named as one on the surfaces that evaluate. Collapsing the
        two would make an undefined cell and a censored cell look alike.

        Shocks are EXACT rationals (`factor_num`/`factor_den`), never floats, and
        a 1/1 shock is a scenario whose information lives on another axis — a
        projection over time, or a market realization the oracles do not see.

        Every `id` here is exactly what `POST /v1/scenarios/{id}/run-book`
        accepts; an id absent from this listing is a 404 there rather than a
        silently empty run.

        The entries are byte-for-byte the entries a stress response's
        `scenarios` array carries, minus that array's per-address `results` —
        one serializer, asserted on the wire by `cmd/api`'s suite, so the two
        surfaces cannot describe different scenarios.

        The example below shows TWO of the committed set's entries (an
        `asset_usd` shock and the rate-axis projection); a served listing carries
        the whole set.
      responses:
        "200":
          description: The committed scenario set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScenariosResponse" }
              example:
                served_at: "2026-07-29T10:00:05Z"
                scenario_config_version: "v1"
                scenarios:
                  - id: "ethfi_minus_50"
                    version: "v1"
                    label: "ETHFI -50 percent"
                    description: "Idiosyncratic own-ecosystem-token shock. ETHFI collateral is correlated with exactly the stress states in which liquidations happen, and sETHFI is composed from ETHFI, so both move on one axis."
                    path_assumption: "instantaneous mark at the shocked level; single-step, no path, no cascade feedback, no partial closes"
                    engines:
                      - "debt_manager"
                    shocks:
                      - axis: "asset_usd"
                        asset: "0xe0080d2F853ecDdbd81A643dC10DA075Df26fD3f"
                        factor_num: 50
                        factor_den: 100
                    out_of_model:
                      - "oracle lag and heartbeat behaviour during the move: the shock is applied as an instantaneous mark, while the real feeds update on deviation or heartbeat"
                      - "deviation-trigger discreteness (a feed moves in rounds, not continuously)"
                      - "liquidator liquidity, gas costs, execution latency and cascade dynamics"
                      - "market correlations not mechanically implied by the read paths recorded in recon/derivation-notes.md"
                      - "intra-sample price wicks: prices are 60-second point samples and an intra-interval spike is invisible by construction (D-012)"
                      - "per-asset base_asset claims are the DEPLOYED composition graph read from PriceProviderV2.tokenConfig(token).baseAsset at the accept-r4 OP pin (block 154938071, hash 0xaf91dd4ba1975fc3b93e411586ce267892406ed8cb7152c5cefe1c368696c6bc, provider 0x44dd2372FE7B97C4B4D6a7d4DeCf72466485BAcB) - a hash-pinned SAMPLE with no continuity claim (chain-truth R3.1), fixture-welded in internal/risk/testdata/tokenconfig_accept_r4.json"
                      - "the sETHFI/ETHFI accountant rate is held flat; a 50 percent ETHFI drawdown is assumed not to change the staking rate"
                      - "reflexivity between the token price and the protocol's own risk parameters"
                  - id: "dm_rate_horizon_plus_200bps"
                    version: "v1"
                    label: "Debt Manager borrow APY +200bps (PROJECTION)"
                    description: "A rate change does not move a spot health factor, so this ships as a closed-form HORIZON PROJECTION, never as a spot shock. The Debt Manager's interest index is linear per second and borrowApy is admin-set, so debt(t) is closed-form: debt0 + floor(debt0 x apy x dt / 100e18). Collateral prices are held flat. The Aave engine is excluded: its rates are utilization-driven and its book is residual dust."
                    path_assumption: "collateral prices held flat at the current sample; the APY steps once, at t=0, and holds for the whole horizon"
                    engines:
                      - "debt_manager"
                    shocks:
                      - axis: "borrow_apy"
                        factor_num: 1
                        factor_den: 1
                    out_of_model:
                      - "oracle lag and heartbeat behaviour during the move: the shock is applied as an instantaneous mark, while the real feeds update on deviation or heartbeat"
                      - "deviation-trigger discreteness (a feed moves in rounds, not continuously)"
                      - "liquidator liquidity, gas costs, execution latency and cascade dynamics"
                      - "market correlations not mechanically implied by the read paths recorded in recon/derivation-notes.md"
                      - "intra-sample price wicks: prices are 60-second point samples and an intra-interval spike is invisible by construction (D-012)"
                      - "borrower behaviour: no repayment, no top-up, no new borrowing over the horizon"
                      - "the closed form floors ONCE on the debt, while the chain floors the INDEX and then the debt - the two differ by at most a couple of units of USD 6-dec, which is why this result is labeled PROJECTION and never gated exact"
                      - "the Aave engine is excluded (utilization-driven rates over a residual dust book)"
                      - "governance behaviour: the APY is admin-set and could move again inside the horizon"
                notes:
                  - "this is the COMMITTED set, compiled into the binary — configuration, not batch data. It carries no batch envelope and is servable before any batch exists; a definition here says what WOULD be evaluated, never what the book is."
                  - "the SAME definitions ride on every /v1/address/{addr}/stress response's `scenarios` array, serialized by the same code. That array carries per-address `results` in addition; nothing else differs, so the two surfaces cannot describe different scenarios."
                  - "every `id` here is exactly what POST /v1/scenarios/{id}/run-book accepts. An id absent from this listing is a 404 there, never a silently empty run."
                  - "`engines` is the set of engines a scenario is DEFINED for. An engine missing from it is out of the scenario's model — a property of the definition, and not the same statement as a withheld engine, which is a refusal and is named as one on the surfaces that evaluate."
                  - "shocks are EXACT rationals: -30% is `factor_num` 70 over `factor_den` 100, never 0.7. There are no floats in this pipeline. A shock of 1/1 is a scenario whose information lives on another axis — a projection over time, or a market realization the oracles do not see."
                  - "`out_of_model` is part of the definition, not a footnote: it names what the scenario does NOT model, and a shocked number read without it is a number read wrong."
                  - "`scenario_config_version` versions the set as a whole, so a client caching results has one token to invalidate on. Files that disagree report MIXED(...) rather than a silently chosen version."
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/scenarios/{id}/run-book:
    post:
      tags: [scenarios]
      operationId: runBookScenario
      summary: One committed scenario evaluated against the WHOLE book
      description: |
        Book-wide aggregate stress: the named scenario from the COMMITTED set —
        the same eleven `/v1/address/{addr}/stress` serves, no arbitrary user
        scenarios — evaluated over every reconstructable position of the newest
        servable batch, reduced to per-engine aggregates.

        POST because the evaluation is computed on request over the whole book;
        it writes nothing. The scenario id must name a committed scenario:
        anything else is a 404, never a silently empty run.

        Deltas are labeled DELTA-ONLY: they are the scenario's own
        contribution, after minus before, over the positions in the run.
        Scenarios whose axis moves no oracle mark assert `hfs_unchanged` in
        `market_realization`; rate scenarios ship as PROJECTIONS with the same
        delta-only basis as the address-level surface. Engines whose whole book
        is withheld are named in `excluded_engines` and appear nowhere else —
        an absence with no name is exactly the silent hole this surface must
        not have.
      parameters:
        - name: id
          in: path
          required: true
          description: A committed scenario id, e.g. `weeth_market_depeg_oracles_held`. An unknown id is a 404.
          schema:
            type: string
            pattern: "^[a-z0-9_]{1,64}$"
      responses:
        "200":
          description: The book-wide result for this scenario.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunBookResponse" }
              example:
                served_at: "2026-07-29T10:00:05Z"
                batch:
                  id: 1
                  computed_at: "2026-07-29T10:00:00Z"
                  age_seconds: 5
