services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: solvent
      POSTGRES_PASSWORD: solvent
      POSTGRES_DB: solvent
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solvent"]
      interval: 2s
      timeout: 2s
      retries: 15
volumes:
  dbdata:
