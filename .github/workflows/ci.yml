name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: solvent
          POSTGRES_PASSWORD: solvent
          POSTGRES_DB: solvent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U solvent" --health-interval 2s
          --health-timeout 2s --health-retries 15
    env:
      # solvent_test is the blessed destructive-test DB (wave-10 split); the guard
      # refuses to Migrate+TRUNCATE any DB carrying the live name/identity, and it
      # needs SOLVENT_DATABASE_URL resolvable to prove test != live (fails closed).
      TEST_DATABASE_URL: postgres://solvent:solvent@localhost:5432/solvent_test?sslmode=disable
      SOLVENT_DATABASE_URL: postgres://solvent:solvent@localhost:5432/solvent?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.24" }
      - name: create test db
        run: psql "$SOLVENT_DATABASE_URL" -c "CREATE DATABASE solvent_test OWNER solvent;"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -p 1 ./...
  # The race lane exists because the dev machine has no C compiler and the race
  # runtime needs cgo — this job is where -race actually runs. Full suite, same
  # DB provisioning as the main job: the concurrency that matters most lives in
  # the live-DB tests (riskd's scheduler loop, the store's batch writers), so a
  # non-DB-only race lane would skip exactly the code most worth racing.
  race:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: solvent
          POSTGRES_PASSWORD: solvent
          POSTGRES_DB: solvent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U solvent" --health-interval 2s
          --health-timeout 2s --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://solvent:solvent@localhost:5432/solvent_test?sslmode=disable
      SOLVENT_DATABASE_URL: postgres://solvent:solvent@localhost:5432/solvent?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "1.24" }
      - name: create test db
        run: psql "$SOLVENT_DATABASE_URL" -c "CREATE DATABASE solvent_test OWNER solvent;"
      - name: test -race
        run: go test -race -count=1 -p 1 ./...
  # The P5 web app (web/, Next.js over @solvent/client). @solvent/client is a
  # file: symlink into packages/client-ts whose dist/ is built on demand by
  # web's ensure-client pre-script — hence the client-ts npm ci first.
  # NEXT_PUBLIC_SHOW_STYLEGUIDE compiles the /styleguide specimen route into
  # the production bundle so the smoke e2e can walk every base component.
  web:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SHOW_STYLEGUIDE: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            packages/client-ts/package-lock.json
      - name: install (client-ts)
        run: npm ci
        working-directory: packages/client-ts
      - name: install (web)
        run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: build
        run: npm run build
      - name: playwright install
        run: npx playwright install --with-deps chromium
      - name: unit + smoke e2e
        run: npm run test:e2e
