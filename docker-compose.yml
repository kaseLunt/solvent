services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: solvent
      POSTGRES_PASSWORD: solvent
      POSTGRES_DB: solvent
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solvent"]
      interval: 2s
      timeout: 2s
      retries: 15
  # db-init provisions the PHYSICAL DB SPLIT (Task 9 wave 10, brief §1 /
  # finding L2-1): `solvent` is the live indexer database the backfill
  # daemon writes; `solvent_test` is the DESTRUCTIVE test suite's scratch
  # database (TEST_DATABASE_URL) — the store tests Migrate + TRUNCATE twelve
  # tables including raw_logs, so the two must never be one database.
  # Idempotent one-shot (safe on every `up`, works on existing volumes where
  # an entrypoint init script would not); cmd/reconcile independently
  # enforces the split with a DSN-identity tripwire at startup.
  db-init:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - sh
      - -c
      - >
        psql postgresql://solvent:solvent@db:5432/postgres -tAc
        "SELECT 1 FROM pg_database WHERE datname='solvent_test'" | grep -q 1
        || psql postgresql://solvent:solvent@db:5432/postgres
        -c 'CREATE DATABASE solvent_test'
volumes:
  dbdata:
