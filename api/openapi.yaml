  /v1/evidence:
    get:
      tags: [evidence]
      operationId: getEvidence
      summary: The deploy-bound evidence manifest — what this deployment is, exactly
      description: |
        The manifest that binds THIS deployment to its evidence: build commit,
        schema version, registry fingerprint, algorithm revision, scenario
        config version, the newest servable batch's substrate digest and
        materialization key, the feeds registry hash, the last committed
        reconcile receipt's summary, and the committed probe records.

        Everything here is either carried by the build, persisted by a batch,
        or read from a COMMITTED artifact. Nothing is measured at request time,
        and absent evidence is stated with null and a reason — never
        approximated. Committed artifacts name endpoints by environment
        variable only; this surface serves no endpoint URL and no DSN.

        THE TWO SUBJECTS (AMENDMENT 1): the manifest separates
        `proof_subject` — the pinned, exactly-reproducible acceptance
        evidence (the committed reconcile receipt and the identity it speaks
        for) — from `live_subject` — the currently-serving batch's
        watermarked identity. They are never one identity: a live batch must
        never read as reconciled-exact, and the proof's exactness lives only
        at its pin. `proof_subject.status` encodes the receipt's own strict
        conjunction (see `ProofSubject`).

        Answers 200 even when no batch is servable: the manifest describes the
        DEPLOYMENT, and `substrate` states batch absence with its reason.
      responses:
        "200":
          description: The deployment's evidence manifest.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EvidenceResponse" }
              example:
                served_at: "2026-07-29T10:00:05Z"
                service:
                  name: "solvent-api"
                  version: "748c09d1e2f3"
                  schema_version: 16
                  algorithm_revision: 4
                  scenario_config_version: "v1"
                  registry_fingerprint: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
                  seizure_model: "pro-rata-over-counted-collateral"
                commit: "748c09d1e2f3"
                proof_subject:
                  status: "accepted"
                  detail: ""
                  pin: "5f0b3e2a4c1d99e21b7a30e12cf5a2b9a4a7c1de00b53219a6f2f41c86a77025"
                live_subject:
                  status: "serving"
                  reason: ""
                substrate:
                  batch_id: 1
                  materialization_key: "9a4a7c1de00b53219a6f2f41c86a77025f0b3e2a4c1d99e21b7a30e12cf5a2b9"
                  substrate_digest: "b23c2c4c182300512dcefa20f0fbf3740ac24077271059e1bd32511fec5f7ab5"
                  note: "the digest is computed over the batch's INPUTS — the risk rows, consulted prices and consulted collateral flags — so two batches with identical substrate digests were computed from identical evidence."
                feeds_registry:
                  path: "recon/feeds.json"
                  registry_fingerprint: "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
                  file_sha256: "2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae"
                  note: "`registry_fingerprint` is computed over the ASSEMBLED registry (the identity the batches are bound to); `file_sha256` is the committed file's bytes as deployed."
                reconcile:
                  schema: "solvent.reconcile.drift-report/v1"
                  result: "pass"
                  exit_code: 0
                  finished_at: "2026-07-29T02:14:07Z"
                  gated_rows: 87
                  gated_exact: 87
                  gated_drift: 0
                  advisory_rows: 21
                  welds:
                    - engine: "debt_manager"
                      rows_compared: 29
                      rows_exact: 29
                    - engine: "aave_v3_etherfi"
                      rows_compared: 14
                      rows_exact: 14
                  comparison_sha256: "5f0b3e2a4c1d99e21b7a30e12cf5a2b9a4a7c1de00b53219a6f2f41c86a77025"
                  artifact_path: "roadmap/evidence/artifacts/w1-reconcile/drift-report.json"
                  note: "read from the COMMITTED receipt artifact; the reconcile itself ran against a pinned block, not at request time."
                probe_records:
                  - path: "recon/p3-probes.md"
                    note: "probe records name endpoints by environment variable only — publishable by construction."
                notes:
                  - "this manifest is deploy-bound: every field is carried by the build, persisted by a batch, or read from a committed artifact. Nothing here is measured at request time."
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/batches/{id}:
    get:
      tags: [batches]
      operationId: getBatch
      summary: One batch's permalink — envelope identity and servability status
      description: |
        The permanent identity record of ONE risk batch: its materialization
        key, substrate digest, counts and per-engine aggregate rollups, plus a
        SERVABILITY verdict relative to the batch that is serving now. This is
        the drawer-pin permalink: a batch id captured from any surface can be
        resolved to the identity it had, for as long as retention keeps it.

        Servability is a statement, not a filter:
          * `newest_servable` — this batch is the one every live surface is
            serving right now.
          * `superseded_retained` — the batch is retained and COMPLETE, but a
            newer servable batch exists; its rows are immutable history.
          * `unservable_incomplete` — the batch's row exists but fails the
            completeness predicate (a torn restore, a partial write); its
            aggregates are WITHHELD (null) rather than served as a plausible
            rollup of a book nobody may read.

        A pruned or never-existing id is a 404 whose message DISCLOSES
        retention: batches are pruned on a retention window, and "not found"
        here means "not retained (or never existed)", never "there was no
        such materialization".
      parameters:
        - name: id
          in: path
          required: true
          description: The batch id, as served by any batch envelope.
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: The batch's identity and servability.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchResponse" }
              example:
                served_at: "2026-07-29T10:00:05Z"
                batch_id: 1
                servability: "newest_servable"
                servability_note: "this batch is the newest servable batch — every live surface is serving it."
                computed_at: "2026-07-29T10:00:00Z"
                producer: "riskd"
                status: "complete"
                position_count: 4
                refused_count: 2
                flagged_count: 1
                materialization_key: "9a4a7c1de00b53219a6f2f41c86a77025f0b3e2a4c1d99e21b7a30e12cf5a2b9"
                substrate_digest: "b23c2c4c182300512dcefa20f0fbf3740ac24077271059e1bd32511fec5f7ab5"
                aggregates:
                  - engine: "aave_v3_etherfi"
                    value_decimals: 8
                    positions: 2
                    computed_positions: 1
                    refused_positions: 1
                    flagged_positions: 1
                    liquidatable_positions: 0
                    sweep: null
                    total_collateral: "800000000000"
                    total_debt: "600000000000"
                    refusal: null
                  - engine: "debt_manager"
                    value_decimals: 6
                    positions: 2
                    computed_positions: 1
                    refused_positions: 1
                    flagged_positions: 0
                    liquidatable_positions: 1
                    sweep:
                      rows: 3
                      failed: 1
                      success_sum: "464379000"
                      max_updated_at: "2026-07-29T09:58:40Z"
                      age_seconds: 85
                      generation: 12
                      generation_open: false
                    total_collateral: "4000000000"
                    total_debt: "4620000000"
                    refusal: null
                notes:
                  - "this record is the batch's IDENTITY, not its rows: per-position pages are served batch-stable by /v1/positions while the batch is newest-servable."
                  - "a withheld engine's aggregate serves NULL totals and names its refusal — persisted zeros under a refusal mean WITHHELD, never an empty healthy book."
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: |
            The batch id is not retained: either retention pruned it, or no
            such batch ever existed — the message states the retention
            disclosure. This is a statement about RETENTION, never a claim
            that the materialization did not happen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/stream:
    get:
      tags: [stream]
      operationId: getStream
      summary: Server-Sent Events — snapshot on connect, batch ticks, degradation transitions, heartbeats
      description: |
        Event names: `snapshot` (sent on every connection, including a reconnect,
        before any tick), `batch` (a new servable batch at a watermark vector —
        never "a new block"), `degradation` (a transition in the refusal / flag /
        supersession posture), `unavailable` (no servable batch). Heartbeats are
        SSE comment frames (`: heartbeat <unix>`) and carry no data.

        Every `data:` payload conforms to `StreamPayload`.
      responses:
        "200":
          description: An event stream.
          content:
            text/event-stream:
              schema: { type: string }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/meta:
    get:
      tags: [meta]
      operationId: getMeta
      summary: Watermark vector, reorg posture, price state, sweep census, published constants
      description: |
        The status surface. It answers 200 even when no batch is servable — a
        status surface that goes dark exactly when something is wrong is not a
        status surface — and says so in `batch_unavailable_reason`.
      responses:
        "200":
          description: Service and data posture.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetaResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  parameters:
    Addr:
      name: addr
      in: path
      required: true
      description: A 0x-prefixed 20-byte address. Validated strictly; a malformed address is a 400, never a silently different account.
      schema:
        type: string
        pattern: "^0[xX][0-9a-fA-F]{40}$"

  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    NotFound:
      description: No such route.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    RateLimited:
      description: The per-client token bucket is empty.
      headers:
        Retry-After:
          description: Seconds to wait.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    InternalError:
      description: The service failed to build the response. The message is sanitized of endpoint URLs and DSNs.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    NoBatch:
      description: |
        No complete risk batch is available. This is a statement about the
        SERVICE, not a claim that the book is empty.
      headers:
        Retry-After:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
    BatchSuperseded:
      description: |
        The cursor is bound to a batch that is no longer the newest servable
        batch. The client restarts pagination from page one against the fresh
        batch — an honest restart. A page silently mixing rows from two
        materializations is exactly what this status exists to prevent.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/BatchSupersededBody" }
          example:
            error:
              code: "batch_superseded"
              message: "the cursor was minted against batch 1, which is no longer the newest servable batch; restart pagination"
              cursor_batch_id: 1
              current_batch_id: 2

  schemas:
    # -----------------------------------------------------------------------
    # Errors
    # -----------------------------------------------------------------------
    ErrorBody:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum: [bad_request, not_found, rate_limited, unavailable, internal]
            message: { type: string }
            retry_after_seconds: { type: integer, format: int64 }

    # -----------------------------------------------------------------------
    # Shared scalars
    # -----------------------------------------------------------------------
    Decimal:
      type: string
      description: An exact integer as a decimal string. NEVER a JSON number.
      pattern: "^-?[0-9]+$"
    NullableDecimal:
      type: string
      nullable: true
      description: An exact integer as a decimal string, or null when the quantity is not applicable on this engine. Absent and zero are different statements.
      pattern: "^-?[0-9]+$"
    Address:
      type: string
      pattern: "^0[xX][0-9a-fA-F]{40}$"

    # -----------------------------------------------------------------------
    # Batch envelope + supersession
    # -----------------------------------------------------------------------
    SweepStamp:
      type: object
      additionalProperties: false
      required: [rows, failed, success_sum, max_updated_at, age_seconds, generation, generation_open]
      properties:
        rows: { type: integer, format: int64 }
        failed: { type: integer, format: int64 }
        success_sum: { $ref: "#/components/schemas/Decimal" }
        max_updated_at: { type: string, format: date-time, nullable: true }
        age_seconds: { type: integer, format: int64, nullable: true }
        generation: { type: integer, format: int64 }
        generation_open: { type: boolean }

    Stamp:
      type: object
      additionalProperties: false
      required: [engine, chain_id, last_block, acked_epoch, max_epoch_at_compute, sweep]
      properties:
        engine: { type: string }
        chain_id: { type: integer, format: int64 }
        last_block: { type: integer, format: int64 }
        acked_epoch: { type: integer, format: int64 }
        max_epoch_at_compute: { type: integer, format: int64 }
        sweep:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/SweepStamp" }]
          description: |
            null means the engine HAS no collateral sweep — not that its sweep is
            empty. Those are different statements and the schema keeps them
            distinguishable.

    SupersessionLeg:
      type: object
      additionalProperties: false
      required:
        [leg, engine, chain_id, stamped_last_block, current_last_block,
         stamped_acked_epoch, current_acked_epoch, current_max_epoch, detail]
      properties:
        leg:
          type: string
          enum: [acked_epoch_moved, last_block_rewound, unacked_epoch_recorded, cursor_absent]
          description: |
            The three legs of the design's supersession check, plus
            `cursor_absent` — the fail-closed answer for a stamped engine whose
            cursor no longer exists, which is not a rewind and is never reported
            as one.
        engine: { type: string }
        chain_id: { type: integer, format: int64 }
        stamped_last_block: { type: integer, format: int64 }
        current_last_block: { type: integer, format: int64, nullable: true }
        stamped_acked_epoch: { type: integer, format: int64 }
        current_acked_epoch: { type: integer, format: int64, nullable: true }
        current_max_epoch: { type: integer, format: int64, nullable: true }
        detail: { type: string }

    Supersession:
      type: object
      additionalProperties: false
      required: [superseded, legs, note]
      properties:
        superseded: { type: boolean }
        legs:
          type: array
          items: { $ref: "#/components/schemas/SupersessionLeg" }
        note: { type: string }

    EngineRefusal:
      type: object
      additionalProperties: false
      required: [engine, code, detail, note]
      description: |
        An ENGINE-SCOPED refusal: the whole book for one engine is withheld for a
        reason that is a property of the ledger rather than of any account.

        Such a refusal **survives an empty account set**. The deep rewind that
        opens the collateral-flag replay deletes every event-sourced Aave
        balance, so a materializer pass in that window has no position to hang a
        refusal on and persists a zeroed rollup carrying only the code. A
        withheld engine is therefore NEVER representable as an empty healthy
        one: its totals are null rather than zero, it is named here, and it is
        named on the batch envelope, the histogram, the waterfall's
        `excluded_engines`, the bad-debt line and the SSE degradation posture.
      properties:
        engine: { type: string }
        code:
          type: string
          description: e.g. FLAG_CUSTODY_UNPROVEN.
        detail: { type: string }
        note: { type: string }

    Batch:
      type: object
      additionalProperties: false
      required:
        [id, computed_at, age_seconds, producer, status, position_count,
         refused_count, refused_engines, flagged_count, watermarks, supersession]
      properties:
        id: { type: integer, format: int64 }
        computed_at: { type: string, format: date-time }
        age_seconds:
          type: integer
          format: int64
          description: Database clock minus `computed_at`, floored at zero. Never the server's wall clock.
        producer: { type: string }
        status: { type: string, enum: [complete] }
        position_count: { type: integer }
        refused_count:
          type: integer
          description: |
            Refused POSITION ROWS. It is ZERO when an engine is withheld with no
            accounts behind it, which is why `refused_engines` exists on the
            summary itself.
        refused_engines:
          type: array
          description: Engines whose WHOLE book is withheld on this batch.
          items: { type: string }
        flagged_count: { type: integer }
        watermarks:
          type: array
          # Non-empty BY CONTRACT: completeness requires at least one stamped
          # engine (the store's predicate refuses a batch with none), and the
          # sweep-disclosure law licenses liquidatable-family fields THROUGH
          # this array — an empty vector would be a licence with no evidence
          # behind it, so the cardinality is part of the contract.
          minItems: 1
          items: { $ref: "#/components/schemas/Stamp" }
        supersession: { $ref: "#/components/schemas/Supersession" }

    # -----------------------------------------------------------------------
    # Aggregates
    # -----------------------------------------------------------------------
    Count:
      type: object
      additionalProperties: false
      required: [key, count]
      properties:
        key: { type: string }
        count: { type: integer }

    Aggregate:
      type: object
      additionalProperties: false
      required:
        [engine, value_decimals, positions, computed_positions, refused_positions,
         flagged_positions, liquidatable_positions, sweep, refused, refusal,
         total_collateral, total_debt, refusals, flags, unit_note]
      properties:
        engine: { type: string }
        value_decimals: { type: integer }
        positions: { type: integer }
        computed_positions: { type: integer }
        refused_positions: { type: integer }
        flagged_positions: { type: integer }
        liquidatable_positions: { type: integer }
        sweep:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/SweepStamp" }]
          description: |
            This engine's sweep stamp on the batch this row rolls up (1.2.2)
            — the same `SweepStamp` the batch envelope's `Stamp.sweep`
            serves, read from the batch's own persisted watermark vector.
            Debt Manager collateral is sweep-sourced, so
            `liquidatable_positions` aggregates a SWEEP-CUT: the stamp
            travels ON THE ROW so no carrier (the SSE stream's nullable
            envelope included) can serve the count without the clock it
            belongs to. Null means the engine HAS no collateral sweep
            (Aave) — a recorded absence, never "unrecorded". `age_seconds`
            inside the stamp is the database clock at serve time minus the
            stamp.
        refused:
          type: boolean
          description: |
            True when this ENGINE's whole book is withheld, whatever the position
            counts say. A reader that branches on nothing else must still be
            unable to mistake this for a healthy engine.
        refusal:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/EngineRefusal" }]
        total_collateral:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
          description: |
            NULL on a refused engine, never "0". A refusal is the ABSENCE of a
            number, and zero is a number — serving zero here is what turns an
            explicitly unproven book into "nothing at risk".
        total_debt: { $ref: "#/components/schemas/NullableDecimal" }
        refusals:
          type: array
          description: The refusal count broken down by named code. A count with no vocabulary behind it is not a disclosure.
          items: { $ref: "#/components/schemas/Count" }
        flags:
          type: array
          items: { $ref: "#/components/schemas/Count" }
        unit_note: { type: string }

    # -----------------------------------------------------------------------
    # Histogram
    # -----------------------------------------------------------------------
    HistogramBucket:
      type: object
      additionalProperties: false
      required: [label, lower_wad, upper_wad, count]
      properties:
        label: { type: string }
        lower_wad: { $ref: "#/components/schemas/NullableDecimal" }
        upper_wad: { $ref: "#/components/schemas/NullableDecimal" }
        count: { type: integer }

    EngineHistogram:
      type: object
      additionalProperties: false
      required: [engine, comparator, buckets, infinite_count, refused_count, refused, refusal, note]
      properties:
        refused:
          type: boolean
          description: |
            True when the ENGINE's book is withheld. Its buckets are then empty
            for that reason and NOT because no position sits there.
        refusal:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/EngineRefusal" }]
        engine: { type: string }
        comparator:
          type: string
          enum: [hf_wad, hf_num/hf_den]
          description: |
            Which quantity the buckets are computed on. Aave uses the pool's own
            health-factor WAD, because that is the chain's comparator. The Debt
            Manager has no wad at all — its buckets are the exact rational
            maxBorrowLT/borrowings, a disclosure only, and its eligibility comes
            from `liquidatable`.
        buckets:
          type: array
          items: { $ref: "#/components/schemas/HistogramBucket" }
        infinite_count: { type: integer }
        refused_count: { type: integer }
        note: { type: string }

    Histogram:
      type: object
      additionalProperties: false
      required: [wad_scale, engines]
      properties:
        wad_scale: { $ref: "#/components/schemas/Decimal" }
        engines:
          type: array
          items: { $ref: "#/components/schemas/EngineHistogram" }

    # -----------------------------------------------------------------------
    # Waterfall
    # -----------------------------------------------------------------------
    HeldFlat:
      type: object
      additionalProperties: false
      required: [asset, chain_id, source, value]
      properties:
        asset: { $ref: "#/components/schemas/Address" }
        chain_id: { type: integer, format: int64 }
        source: { type: string }
        value: { $ref: "#/components/schemas/Decimal" }

    WaterfallEngine:
      type: object
      additionalProperties: false
      required:
        [engine, usd_decimals, newly_eligible_accounts, cumulative_eligible_accounts,
         cumulative_debt_eligible_usd, cumulative_collateral_at_risk_usd,
         insolvent_if_liquidated_accounts, cumulative_bad_debt_usd]
      properties:
        engine: { type: string }
        usd_decimals: { type: integer }
        newly_eligible_accounts: { type: integer }
        cumulative_eligible_accounts: { type: integer }
        cumulative_debt_eligible_usd:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Debt ELIGIBLE for liquidation, measured at this grid point. Realized is less than or equal to eligible.
        cumulative_collateral_at_risk_usd: { $ref: "#/components/schemas/Decimal" }
        insolvent_if_liquidated_accounts: { type: integer }
        cumulative_bad_debt_usd: { $ref: "#/components/schemas/Decimal" }

    WaterfallPoint:
      type: object
      additionalProperties: false
      required: [index, factor, engines]
      properties:
        index: { type: integer }
        factor:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: The grid factor, WAD-scaled (1e18 = 1.0, unshocked).
        engines:
          type: array
          items: { $ref: "#/components/schemas/WaterfallEngine" }

    Monotonicity:
      type: object
      additionalProperties: false
      required: [ok]
      description: |
        The standing invariant on the debt-eligible series. A violation is
        SURFACED with the offending grid point named — never smoothed away — and
        the points computed so far are still served.
      properties:
        ok: { type: boolean }
        engine: { type: string }
        index: { type: integer }
        factor: { type: string }
        detail: { type: string }

    Waterfall:
      type: object
      additionalProperties: false
      required:
        [scenario_id, scenario_version, axis, grid_scale, points, held_flat,
         eligibility_note, monotonicity, at_risk_note, excluded_engines]
      properties:
        scenario_id: { type: string }
        scenario_version: { type: string }
        axis: { type: string }
        axis_asset: { type: string }
        grid_scale: { $ref: "#/components/schemas/Decimal" }
        points:
          type: array
          items: { $ref: "#/components/schemas/WaterfallPoint" }
        held_flat:
          type: array
          description: Every price input no propagation row described. Empty is the claim that the matrix covered the whole book.
          items: { $ref: "#/components/schemas/HeldFlat" }
        eligibility_note: { type: string }
        monotonicity: { $ref: "#/components/schemas/Monotonicity" }
        at_risk_note: { type: string }
        excluded_engines:
          type: array
          description: |
            Engines WITHHELD at the aggregate level. Such an engine contributes no
            positions, so it is absent from `points[].engines` entirely — and an
            absence with no name attached is exactly the silent hole this surface
            must not have.
          items: { $ref: "#/components/schemas/EngineRefusal" }

    BadDebt:
      type: object
      additionalProperties: false
      required:
        [engine, usd_decimals, current_bad_debt_usd, insolvent_positions,
         eligible_positions, eligible_debt_usd, collateral_at_risk_usd,
         refused, refusal]
      properties:
        engine: { type: string }
        usd_decimals: { type: integer }
        current_bad_debt_usd:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
          description: |
            The standing census at the UNSHOCKED grid point, not a projection.
            NULL on a withheld engine: a bad-debt line of "0" over a book nobody
            was allowed to compute is the most dangerous zero on this surface.
        insolvent_positions: { type: integer, nullable: true }
        eligible_positions: { type: integer, nullable: true }
        eligible_debt_usd: { $ref: "#/components/schemas/NullableDecimal" }
        collateral_at_risk_usd: { $ref: "#/components/schemas/NullableDecimal" }
        refused: { type: boolean }
        refusal:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/EngineRefusal" }]

    Excluded:
      type: object
      additionalProperties: false
      required: [engine, account, code, reason]
      properties:
        engine: { type: string }
        account: { $ref: "#/components/schemas/Address" }
        code: { type: string, enum: [API_RECONSTRUCTION_MISMATCH] }
        reason: { type: string }

    BookCoverage:
      type: object
      additionalProperties: false
      required:
        [batch_positions, in_book, refused_in_batch, excluded_by_this_layer,
         excluded, withheld_engines, stress_coverage_is_full, note]
      description: |
        The audit of what reached the derived arithmetic. It exists so an
        exclusion can never be silent, in EITHER of the two ways one can happen: a
        position the service could not rebuild into the pure library's input form
        (`excluded`), or an ENGINE whose whole book is withheld and is therefore
        absent from every scenario (`withheld_engines`).
      properties:
        batch_positions: { type: integer }
        in_book: { type: integer }
        refused_in_batch: { type: integer }
        excluded_by_this_layer: { type: integer }
        excluded:
          type: array
          items: { $ref: "#/components/schemas/Excluded" }
        withheld_engines:
          type: array
          items: { $ref: "#/components/schemas/EngineRefusal" }
        stress_coverage_is_full:
          type: boolean
          description: |
            A BOOK-WIDE claim: false if any position could not be rebuilt OR any
            engine is withheld. It is not a per-position predicate — a
            reconstruction-only reading would stay green while an entire engine was
            missing from the stress and waterfall arithmetic.
        note: { type: string }

    BookResponse:
      type: object
      additionalProperties: false
      required: [served_at, batch, refused_engines, engines, hf_histogram, waterfall, bad_debt, coverage, notes]
      properties:
        served_at: { type: string, format: date-time }
        batch: { $ref: "#/components/schemas/Batch" }
        refused_engines:
          type: array
          description: |
            The top-level, unmissable statement of which engines are withheld.
            Repeated from the batch envelope and the per-engine rows so a consumer
            that reads only the head of this document still cannot conclude the
            book is whole.
          items: { $ref: "#/components/schemas/EngineRefusal" }
        engines:
          type: array
          items: { $ref: "#/components/schemas/Aggregate" }
        hf_histogram: { $ref: "#/components/schemas/Histogram" }
        waterfall:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Waterfall" }]
        bad_debt:
          type: array
          items: { $ref: "#/components/schemas/BadDebt" }
        coverage: { $ref: "#/components/schemas/BookCoverage" }
        notes:
          type: array
          items: { type: string }

    # -----------------------------------------------------------------------
    # Address
    # -----------------------------------------------------------------------
    Refusal:
      type: object
      additionalProperties: false
      required: [code, detail, note]
      properties:
        code:
          type: string
          description: |
            G1 missing/over-ceiling input, G2 unacked price reorg epoch, G3 store
            unreadable, SWEEP_NEVER, ENGINE, FLAG_CUSTODY_UNPROVEN, or
            API_RECONSTRUCTION_MISMATCH.
        detail: { type: string }
        asset: { $ref: "#/components/schemas/Address" }
        note: { type: string }

    HealthFactor:
      type: object
      additionalProperties: false
      required: [wad, num, den, infinite, note]
      properties:
        wad:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
          description: |
            The pool's own health factor, 18-decimal. Present on Aave only.
            Compare against 1e18 ON THE WAD; do not re-derive a float from
            num/den to decide eligibility.
        num: { $ref: "#/components/schemas/NullableDecimal" }
        den: { $ref: "#/components/schemas/NullableDecimal" }
        infinite:
          type: boolean
          description: >-
            No debt — the ratio is unbounded rather than a large number.
        note: { type: string }

    Leg:
      type: object
      additionalProperties: false
      required:
        [asset, decimals, live_debt, live_collateral, debt_base, collateral_base,
         weighted_lt, used_as_collateral, debt_index_block, collateral_index_block,
         amount, value_usd, max_borrow_contribution, liq_threshold, liq_bonus]
      properties:
        asset: { $ref: "#/components/schemas/Address" }
        symbol: { type: string }
        decimals: { type: integer }
        live_debt: { $ref: "#/components/schemas/NullableDecimal" }
        live_collateral: { $ref: "#/components/schemas/NullableDecimal" }
        debt_base: { $ref: "#/components/schemas/NullableDecimal" }
        collateral_base: { $ref: "#/components/schemas/NullableDecimal" }
        weighted_lt: { $ref: "#/components/schemas/NullableDecimal" }
        used_as_collateral: { type: boolean, nullable: true }
        debt_index_block:
          type: integer
          format: int64
          nullable: true
          description: This leg's OWN rate-index as-of. It can trail the balances cursor badly, so it travels with the leg rather than borrowing the position's watermark.
        collateral_index_block: { type: integer, format: int64, nullable: true }
        amount: { $ref: "#/components/schemas/NullableDecimal" }
        value_usd: { $ref: "#/components/schemas/NullableDecimal" }
        max_borrow_contribution: { $ref: "#/components/schemas/NullableDecimal" }
        liq_threshold: { $ref: "#/components/schemas/NullableDecimal" }
        liq_bonus: { $ref: "#/components/schemas/NullableDecimal" }

    PriceInput:
      type: object
      additionalProperties: false
      required:
        [asset, chain_id, source, provenance, value, decimals, block_number,
         source_as_of, budget_seconds, verdict, age_seconds, fresh, note]
      description: |
        The FULL snapshot the batch persisted for one price input — never an
        identity reference resolved at request time.
      properties:
        asset: { $ref: "#/components/schemas/Address" }
        chain_id: { type: integer, format: int64 }
        source: { type: string }
        provenance:
          type: string
          description: |
            engine-exact, adapter-output, uncapped-feed or ratio-reference. Only
            the first two may value an Aave position: the uncapped feed equals the
            adapter's output exactly while no price cap binds, and caps bind in
            the very scenarios a liquidation engine cares most about.
        value: { $ref: "#/components/schemas/NullableDecimal" }
        decimals: { type: integer, nullable: true }
        block_number: { type: integer, format: int64, nullable: true }
        source_as_of:
          type: string
          format: date-time
          nullable: true
          description: The chain-asserted as-of. Database insert time is never substituted; an input with none is refused.
        budget_seconds: { type: integer, format: int64 }
        verdict:
          type: string
          enum: [fresh, stale, over-ceiling, missing, no-as-of, reorg-unacked]
        age_seconds: { type: integer, format: int64, nullable: true }
        fresh: { type: boolean }
        note: { type: string }

    AsOf:
      type: object
      additionalProperties: false
      required: [balances_block, params_block, sweep_block, oldest_price_input, stale_price_inputs, note]
      properties:
        balances_block: { type: integer, format: int64 }
        params_block: { type: integer, format: int64 }
        sweep_block:
          type: integer
          format: int64
          description: The account's own last successful collateral sweep. On the Debt Manager this is the collateral as-of and is worst-case ~1.5h behind, while prices are 60s samples.
        oldest_price_input: { type: string, format: date-time, nullable: true }
        stale_price_inputs: { type: boolean }
        note: { type: string }

    FactorPrice:
      type: object
      additionalProperties: false
      required: [asset, current_price, price_decimals, price_floor, lowest_healthy_price]
      properties:
        asset: { $ref: "#/components/schemas/Address" }
        current_price: { $ref: "#/components/schemas/Decimal" }
        price_decimals: { type: integer }
        price_floor: { $ref: "#/components/schemas/NullableDecimal" }
        lowest_healthy_price:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
          description: ceil(P*) — the conservative number to render. At exactly this price the position is still healthy.

    LiquidationPrice:
      type: object
      additionalProperties: false
      required:
        [in_factor, never_liquidatable, scale_factor_num, scale_factor_den,
         already_breached, prices, factor_assets, held_assets,
         boundary_is_healthy, per_token_floor_omitted, diagnostic, axis, note]
      description: |
        The FACTOR-LEVEL closed-form solve: all assets that move together with the
        axis move together here. A single-asset solve on a position holding other
        counted collateral is the ceteris-paribus variant and is flagged
        `diagnostic`.
      properties:
        in_factor: { type: boolean }
        never_liquidatable: { type: boolean }
        reason: { type: string }
        scale_factor_num: { $ref: "#/components/schemas/NullableDecimal" }
        scale_factor_den: { $ref: "#/components/schemas/NullableDecimal" }
        already_breached: { type: boolean }
        prices:
          type: array
          items: { $ref: "#/components/schemas/FactorPrice" }
        factor_assets:
          type: array
          items: { $ref: "#/components/schemas/Address" }
        held_assets:
          type: array
          items: { $ref: "#/components/schemas/Address" }
        boundary_is_healthy: { type: boolean }
        per_token_floor_omitted: { type: boolean }
        diagnostic: { type: boolean }
        axis: { type: string }
        note: { type: string }

    Position:
      type: object
      additionalProperties: false
      required:
        [engine, account, status, value_decimals, refusal, flags, health_factor,
         liquidatable, total_collateral_base, total_debt_base, weighted_lt_sum,
         avg_lt_bps, collateral_value_usd, max_borrow_lt, borrowings, legs,
         price_inputs, as_of, liquidation_price]
      properties:
        engine: { type: string }
        account: { $ref: "#/components/schemas/Address" }
        status: { type: string, enum: [computed, refused] }
        value_decimals: { type: integer }
        refusal:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Refusal" }]
        flags:
          type: array
          items: { type: string }
        health_factor:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/HealthFactor" }]
        liquidatable:
          type: boolean
          nullable: true
          description: The Debt Manager's strict test (`debt > maxBorrowLT`; equality is healthy). Null on Aave, which publishes a continuous health factor instead.
        total_collateral_base: { $ref: "#/components/schemas/NullableDecimal" }
        total_debt_base: { $ref: "#/components/schemas/NullableDecimal" }
        weighted_lt_sum: { $ref: "#/components/schemas/NullableDecimal" }
        avg_lt_bps:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
          description: DISCLOSURE ONLY. It is not an input to the health factor; the pool divides after computing it.
        collateral_value_usd: { $ref: "#/components/schemas/NullableDecimal" }
        max_borrow_lt: { $ref: "#/components/schemas/NullableDecimal" }
        borrowings: { $ref: "#/components/schemas/NullableDecimal" }
        legs:
          type: array
          items: { $ref: "#/components/schemas/Leg" }
        price_inputs:
          type: array
          items: { $ref: "#/components/schemas/PriceInput" }
        as_of: { $ref: "#/components/schemas/AsOf" }
        liquidation_price:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/LiquidationPrice" }]

    AddressResponse:
      type: object
      additionalProperties: false
      required:
        [served_at, batch, address, positions, found, lookup_complete,
         withheld_engines, lookup_complete_note, notes]
      properties:
        served_at: { type: string, format: date-time }
        batch: { $ref: "#/components/schemas/Batch" }
        address: { $ref: "#/components/schemas/Address" }
        positions:
          type: array
          items: { $ref: "#/components/schemas/Position" }
        found:
          type: boolean
          nullable: true
          description: |
            THREE-VALUED.

            - `true` — at least one position was found. A positive existence claim,
              safe to assert whatever else is withheld (but see `lookup_complete`:
              it may be a floor rather than a total).
            - `false` — a DEFINITIVE negative: no position exists in this batch, and
              every engine was available to be asked.
            - `null` — the answer CANNOT BE ESTABLISHED, because an engine's whole
              book is withheld. A withheld engine has zero position rows, so a
              `false` derived from the row count would publish a definitive negative
              exactly where the service cannot determine one. **Never render null as
              "no position".**
        lookup_complete:
          type: boolean
          description: Whether every engine could be consulted for this lookup.
        withheld_engines:
          type: array
          description: Engines whose whole book is withheld, and which this lookup therefore could not consult.
          items: { $ref: "#/components/schemas/EngineRefusal" }
        lookup_complete_note: { type: string }
        notes:
          type: array
          items: { type: string }

    # -----------------------------------------------------------------------
    # Stress
    # -----------------------------------------------------------------------
    Shock:
      type: object
      additionalProperties: false
      required: [axis, factor_num, factor_den]
      properties:
        axis:
          type: string
          enum: [eth_usd, weeth_eth_rate, stable_usd, asset_usd, borrow_apy]
        asset: { type: string }
        factor_num:
          type: integer
          format: int64
          description: An EXACT rational. -20% is 80/100, never 0.8 — there are no floats in this pipeline.
        factor_den: { type: integer, format: int64 }

    AppliedShock:
      type: object
      additionalProperties: false
      required: [asset, chain_id, source, factor_num, factor_den, before, after, snapped, base_snapped, cap_bound]
      properties:
        asset: { $ref: "#/components/schemas/Address" }
        chain_id: { type: integer, format: int64 }
        source: { type: string }
        factor_num: { $ref: "#/components/schemas/Decimal" }
        factor_den: { $ref: "#/components/schemas/Decimal" }
        before: { $ref: "#/components/schemas/Decimal" }
        after: { $ref: "#/components/schemas/Decimal" }
        snapped:
          type: boolean
          description: The Debt Manager's stable snap band swallowed the move. The band is OPEN — (990000, 1010000) exclusive — so exactly 0.99 does NOT snap.
        base_snapped: { type: boolean }
        cap_bound: { type: boolean }

    StressState:
      type: object
      additionalProperties: false
      required:
        [health_factor_wad, health_factor_num, health_factor_den, infinite,
         liquidatable, eligible, collateral_usd, debt_usd, max_borrow_lt]
      properties:
        health_factor_wad: { $ref: "#/components/schemas/NullableDecimal" }
        health_factor_num: { $ref: "#/components/schemas/NullableDecimal" }
        health_factor_den: { $ref: "#/components/schemas/NullableDecimal" }
        infinite: { type: boolean }
        liquidatable: { type: boolean, nullable: true }
        eligible:
          type: boolean
          description: Eligible for liquidation. Aave is strictly below 1e18 on the wad; the Debt Manager is its strict boolean.
        collateral_usd: { $ref: "#/components/schemas/NullableDecimal" }
        debt_usd: { $ref: "#/components/schemas/NullableDecimal" }
        max_borrow_lt: { $ref: "#/components/schemas/NullableDecimal" }

    Shortfall:
      type: object
      additionalProperties: false
      required: [hfs_unchanged, execution_shortfall_usd, bad_debt_at_liquidation_usd, usd_decimals, seizure_model, note]
      description: |
        The market-realization axis. Market value is NOT an oracle mark, so this
        scenario moves no health factor — `hfs_unchanged` asserts it — and the
        output is the gap the protocol is not seeing.
      properties:
        hfs_unchanged: { type: boolean }
        execution_shortfall_usd: { $ref: "#/components/schemas/Decimal" }
        bad_debt_at_liquidation_usd: { $ref: "#/components/schemas/Decimal" }
        usd_decimals: { type: integer }
        seizure_model:
          type: string
          enum: [pro-rata-over-counted-collateral]
          description: The disclosed seizure assumption behind the shortfall arithmetic.
        note: { type: string }

    ProjectionHorizon:
      type: object
      additionalProperties: false
      required: [horizon_seconds, debt_usd, projected_usd, additional_interest_usd, becomes_liquidatable]
      properties:
        horizon_seconds: { type: integer, format: int64 }
        debt_usd: { $ref: "#/components/schemas/Decimal" }
        projected_usd: { $ref: "#/components/schemas/Decimal" }
        additional_interest_usd: { $ref: "#/components/schemas/Decimal" }
        becomes_liquidatable: { type: boolean, nullable: true }

    Projection:
      type: object
      additionalProperties: false
      required: [label, basis, annual_delta_bps, apy_observed_at_block, prices_held_flat, horizons, note]
      description: |
        The rate axis is a PROJECTION over time, never a spot health-factor shock.
        `basis: delta-only` means the numbers are the rate change's OWN
        contribution: a batch carries no borrow-APY observation and this service
        makes no chain calls, so the base accrual is absent — and no
        time-to-liquidatable is published from a path that would understate debt
        growth.
      properties:
        label: { type: string, enum: [PROJECTION] }
        basis: { type: string, enum: [delta-only] }
        annual_delta_bps: { type: integer, format: int64 }
        apy_observed_at_block: { type: integer, format: int64 }
        prices_held_flat: { type: boolean }
        horizons:
          type: array
          items: { $ref: "#/components/schemas/ProjectionHorizon" }
        note: { type: string }

    ScenarioResult:
      type: object
      additionalProperties: false
      required: [engine, account, applicable, before, after, applied_shocks, held_flat, market_realization, projection]
      properties:
        engine: { type: string }
        account: { $ref: "#/components/schemas/Address" }
        applicable: { type: boolean }
        reason:
          type: string
          description: Why a result is absent — the scenario does not cover this engine, the batch refused the position, or the service could not rebuild it. Never silence.
        before:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/StressState" }]
        after:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/StressState" }]
        applied_shocks:
          type: array
          items: { $ref: "#/components/schemas/AppliedShock" }
        held_flat:
          type: array
          items: { $ref: "#/components/schemas/HeldFlat" }
        market_realization:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Shortfall" }]
        projection:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Projection" }]

    ScenarioDefinition:
      type: object
      additionalProperties: false
      required: [id, version, label, description, path_assumption, engines, shocks, out_of_model]
      description: |
        One COMMITTED scenario's DEFINITION: what it shocks, on which primitive
        axes, for which engines, under which path assumption, and what it
        explicitly does not model. It says nothing about any address or any
        batch — it is configuration compiled into the service.

        This is the whole element of `GET /v1/scenarios`, and it is exactly
        `Scenario` minus `results`. The two are kept in lockstep by the same Go
        serializer (`cmd/api`'s `scenarioDefinition`, embedded in the stress
        element type) and by a contract test that holds THESE TWO SCHEMAS to
        "same properties, same required set, same per-property schema, plus
        `results`". A field added to one and forgotten on the other would
        publish two different descriptions of one committed definition.
      properties:
        id:
          type: string
          description: The committed id — exactly what `POST /v1/scenarios/{id}/run-book` accepts.
        version: { type: string }
        label: { type: string }
        description: { type: string }
        path_assumption:
          type: string
          description: The path the scenario assumes to the shocked state. A shocked number read without it is a number read wrong.
        engines:
          type: array
          description: |
            The engines this scenario is DEFINED for. An engine absent here is
            outside the scenario's model — a property of the DEFINITION, and not
            the same statement as a withheld engine (a refusal, named as one on
            the surfaces that evaluate).
          items: { type: string }
        shocks:
          type: array
          items: { $ref: "#/components/schemas/Shock" }
        out_of_model:
          type: array
          description: What the scenario does NOT model. Part of the definition, never a footnote.
          items: { type: string }

    Scenario:
      type: object
      additionalProperties: false
      required: [id, version, label, description, path_assumption, engines, shocks, out_of_model, results]
      description: |
        One committed scenario AT AN ADDRESS: the `ScenarioDefinition` fields —
        identical, field for field, to what `GET /v1/scenarios` serves — plus
        the per-address `results` this surface computes. `results` is the ONLY
        difference between the two.

        The fields are spelled out rather than composed with `allOf` because
        every object in this contract sets `additionalProperties: false`, and
        composition under that rule validates nothing. The lockstep is enforced
        by test instead — see `ScenarioDefinition`.
      properties:
        id:
          type: string
          description: The committed id — exactly what `POST /v1/scenarios/{id}/run-book` accepts.
        version: { type: string }
        label: { type: string }
        description: { type: string }
        path_assumption:
          type: string
          description: The path the scenario assumes to the shocked state. A shocked number read without it is a number read wrong.
        engines:
          type: array
          description: |
            The engines this scenario is DEFINED for. An engine absent here is
            outside the scenario's model — a property of the DEFINITION, and not
            the same statement as a withheld engine (a refusal, named as one on
            the surfaces that evaluate).
          items: { type: string }
        shocks:
          type: array
          items: { $ref: "#/components/schemas/Shock" }
        out_of_model:
          type: array
          description: What the scenario does NOT model. Part of the definition, never a footnote.
          items: { type: string }
        results:
          type: array
          items: { $ref: "#/components/schemas/ScenarioResult" }

    StressResponse:
      type: object
      additionalProperties: false
      required:
        [served_at, batch, address, scenario_config_version, found,
         lookup_complete, withheld_engines, lookup_complete_note, scenarios, notes]
      properties:
        served_at: { type: string, format: date-time }
        batch: { $ref: "#/components/schemas/Batch" }
        address: { $ref: "#/components/schemas/Address" }
        scenario_config_version: { type: string }
        found:
          type: boolean
          nullable: true
          description: |
            THREE-VALUED, with the same contract as `/v1/address`. A withheld engine
            has no positions to stress, so `null` means the answer could not be
            established — never that no position exists.
        lookup_complete: { type: boolean }
        withheld_engines:
          type: array
          items: { $ref: "#/components/schemas/EngineRefusal" }
        lookup_complete_note: { type: string }
        scenarios:
          type: array
          items: { $ref: "#/components/schemas/Scenario" }
        notes:
          type: array
          items: { type: string }

    ScenariosResponse:
      type: object
      additionalProperties: false
      required: [served_at, scenario_config_version, scenarios, notes]
      description: |
        The committed scenario listing. NO batch envelope, deliberately: the set
        is configuration compiled into the service, not a materialization, and
        pinning it to a batch would be a claim the definitions do not make. That
        is also why this response is servable with no batch in the database —
        `served_at` is the database clock, and nothing else here is measured at
        request time.
      properties:
        served_at: { type: string, format: date-time }
        scenario_config_version:
          type: string
          description: |
            The committed set's version AS A WHOLE — the same token `/v1/meta`,
            `/v1/evidence` and every stress response publish, so a client
            caching results has one thing to invalidate on. Files that disagree
            report `MIXED(...)` rather than a silently chosen version.
        scenarios:
          type: array
          items: { $ref: "#/components/schemas/ScenarioDefinition" }
        notes:
          type: array
          items: { type: string }

    # -----------------------------------------------------------------------
    # Observatory
    # -----------------------------------------------------------------------
    ObservatoryPoint:
      type: object
      additionalProperties: false
      required: [batch_id, computed_at, age_seconds, watermarks, engines]
      properties:
        batch_id: { type: integer, format: int64 }
        computed_at: { type: string, format: date-time }
        age_seconds: { type: integer, format: int64 }
        watermarks:
          type: array
          minItems: 1
          description: |
            THIS batch's per-engine watermark vector — the same `Stamp` shape
            the batch envelope serves, INCLUDING each engine's sweep stamp —
            read from the store's persisted `risk_batch_watermarks` for the
            point's own `batch_id` (1.2.2). The point carries its OWN batch
            clock (`batch_id`, `computed_at`), so the response envelope
            cannot vouch for it; without this vector its
            `liquidatable_positions` counts would aggregate a sweep-cut the
            surface never names. Non-empty by the completeness predicate: a
            servable batch has at least one stamped engine.
          items: { $ref: "#/components/schemas/Stamp" }
        engines:
          type: array
          items: { $ref: "#/components/schemas/Aggregate" }

    RateIndex:
      type: object
      additionalProperties: false
      required: [engine, asset, kind, scale, value, as_of_block, note]
      properties:
        engine: { type: string }
        asset: { $ref: "#/components/schemas/Address" }
        symbol: { type: string }
        kind:
          type: string
          description: The custodied index kind — `variable_borrow_index` / `liquidity_index` (Aave, per ReserveDataUpdated) or `borrow_index` (the Debt Manager's per-token interest index).
        scale:
          type: string
          enum: [ray-1e27, index-1e18, unstated]
          description: |
            The value's own denomination, from the closed per-kind vocabulary:
            `ray-1e27` for Aave's reserve indexes, `index-1e18` for the Debt
            Manager's interest index (the USD-6 view of a normalized amount
            is value × index ÷ 1e18). `unstated` is the fail-honest tag for a
            kind outside the known vocabulary — the raw decimal still serves
            verbatim, and no scale is invented for it.
        value: { $ref: "#/components/schemas/Decimal" }
        as_of_block:
          type: integer
          format: int64
          description: The index's OWN as-of. It updates only on its own admin/update event and can trail the derive cursor.
        note: { type: string }

    ObservatoryResponse:
      type: object
      additionalProperties: false
      required: [served_at, limit, series, rate_indexes, notes]
      properties:
        served_at: { type: string, format: date-time }
        limit: { type: integer }
        series:
          type: array
          items: { $ref: "#/components/schemas/ObservatoryPoint" }
        rate_indexes:
          type: array
          items: { $ref: "#/components/schemas/RateIndex" }
        notes:
          type: array
          items: { type: string }

    # -----------------------------------------------------------------------
    # Meta
    # -----------------------------------------------------------------------
    Service:
      type: object
      additionalProperties: false
      required:
        [name, version, schema_version, algorithm_revision,
         scenario_config_version, registry_fingerprint, seizure_model]
      properties:
        name: { type: string }
        version: { type: string }
        schema_version:
          type: integer
          format: int64
          description: The goose migration version this build's queries were written against. The service refuses to start against anything else, and never migrates.
        algorithm_revision: { type: integer }
        scenario_config_version: { type: string }
        registry_fingerprint: { type: string }
        seizure_model: { type: string, enum: [pro-rata-over-counted-collateral] }

    Cursor:
      type: object
      additionalProperties: false
      required: [engine, chain_id, last_block, acked_epoch, covered_from_block, decoder_revision, consumed_by_risk]
      properties:
        engine: { type: string }
        chain_id: { type: integer, format: int64 }
        last_block: { type: integer, format: int64 }
        acked_epoch: { type: integer, format: int64 }
        covered_from_block:
          type: integer
          format: int64
          nullable: true
          description: Where the walk that produced the current derived state began. Null means UNPROVEN provenance — never "covered from genesis".
        decoder_revision: { type: integer }
        consumed_by_risk: { type: boolean }

    ChainEpoch:
      type: object
      additionalProperties: false
      required: [chain_id, max_epoch]
      properties:
        chain_id: { type: integer, format: int64 }
        max_epoch: { type: integer, format: int64 }

    ReorgPosture:
      type: object
      additionalProperties: false
      required: [max_epochs, superseded, legs, leg_names, note]
      properties:
        max_epochs:
          type: array
          items: { $ref: "#/components/schemas/ChainEpoch" }
        superseded: { type: boolean }
        legs:
          type: array
          items: { $ref: "#/components/schemas/SupersessionLeg" }
        leg_names:
          type: array
          items: { type: string }
        note: { type: string }

    PriceState:
      type: object
      additionalProperties: false
      required:
        [chain_id, asset, symbol, source, owner_engine, provenance, value,
         decimals, block_number, anchor_block, observed_at, source_as_of,
         age_seconds, valid, invalid_reason, quarantined_rows,
         highest_quarantined_block, is_valuation_witness]
      properties:
        chain_id: { type: integer, format: int64 }
        asset: { $ref: "#/components/schemas/Address" }
        symbol: { type: string }
        source: { type: string }
        owner_engine: { type: string }
        provenance: { type: string }
        value: { $ref: "#/components/schemas/NullableDecimal" }
        decimals: { type: integer }
        block_number: { type: integer, format: int64 }
        anchor_block: { type: integer, format: int64, nullable: true }
        observed_at:
          type: string
          format: date-time
          description: DATABASE INSERT TIME. It is published for operational visibility and is NEVER an as-of.
        source_as_of: { type: string, format: date-time, nullable: true }
        age_seconds:
          type: integer
          format: int64
          nullable: true
          description: Database clock minus `source_as_of`. Null when the row carries no chain-asserted as-of; `observed_at` is never substituted.
        valid: { type: boolean }
        invalid_reason: { type: string }
        quarantined_rows:
          type: integer
          format: int64
          description: Rows for this key carrying valid=false at ANY height, so a quarantine stays visible after a newer valid poll lands above it. Those rows are retained, never deleted.
        highest_quarantined_block: { type: integer, format: int64, nullable: true }
        is_valuation_witness: { type: boolean }
        valuation_witness_note: { type: string }

    Neutralized:
      type: object
      additionalProperties: false
      required: [owner_engine, chain_id, rows, oldest_observed_at, newest_observed_at, highest_block]
      properties:
        owner_engine: { type: string }
        chain_id: { type: integer, format: int64 }
        rows:
          type: integer
          format: int64
          description: The retained-but-unusable backlog. -1 means the counter itself could not be read.
        oldest_observed_at: { type: string, format: date-time, nullable: true }
        newest_observed_at: { type: string, format: date-time, nullable: true }
        highest_block: { type: integer, format: int64 }

    SweepCounts:
      type: object
      additionalProperties: false
      required: [engine, rows, never_swept, failed_since_success, success, note]
      properties:
        engine: { type: string }
        rows: { type: integer, format: int64 }
        never_swept:
          type: integer
          format: int64
          description: Collateral of UNKNOWN size, never zero. Serving a health factor near zero over it would be a false liquidation alarm.
        failed_since_success: { type: integer, format: int64 }
        success: { type: integer, format: int64 }
        note: { type: string }

    Heartbeat:
      type: object
      additionalProperties: false
      required:
        [chain_id, symbol, proxy, aggregator, heartbeat_seconds, grace_seconds,
         provenance_grade, observed_max_gap_seconds, tested_budget_seconds,
         budget_refuted, basis]
      properties:
        chain_id: { type: integer, format: int64 }
        symbol: { type: string }
        proxy: { $ref: "#/components/schemas/Address" }
        aggregator: { $ref: "#/components/schemas/Address" }
        heartbeat_seconds: { type: integer, format: int64 }
        grace_seconds: { type: integer, format: int64 }
        provenance_grade:
          type: string
          enum:
            - verified
            - empirical-historical-with-qualifier
            - published-and-refuted
            - published-not-verified
          description: |
            What the repo's evidence says about THE BUDGET ITSELF.

            - `verified` — value independently evidenced AND an empirical scan
              cleared it. No feed currently holds it: a complete ledger's maximum
              gap is exact HISTORY and cannot certify the future, so a scan never
              produces this grade on its own.
            - `empirical-historical-with-qualifier` — a scan measured a maximum
              publication gap ABOVE the published heartbeat but within the declared
              operator grace. The budget survives; the headroom does not.
            - `published-and-refuted` — a scan measured a gap BEYOND heartbeat plus
              grace. The published budget is FALSIFIED. Reporting such a feed as
              merely awaiting confirmation would overstate provenance: the evidence
              is in and it is negative.
            - `published-not-verified` — the published parameter, taken on trust,
              with no scan behind it either way.
        observed_max_gap_seconds:
          type: integer
          format: int64
          nullable: true
          description: The scan's measured maximum publication interval. Null when no scan has judged this feed.
        tested_budget_seconds:
          type: integer
          format: int64
          nullable: true
          description: The budget that gap was judged against — heartbeat plus the declared operator grace.
        budget_refuted:
          type: boolean
          description: |
            The one-bit form of `provenance_grade == published-and-refuted`, so a
            consumer cannot miss a falsified budget by failing to enumerate the
            grade vocabulary.
        basis: { type: string }

    Constants:
      type: object
      additionalProperties: false
      required:
        [confirmation_blocks, price_poll_seconds, dm_sweep_interval_seconds,
         dm_sweep_pass_seconds, dm_sweep_worst_case_seconds, price_budget_seconds,
         price_ceiling_seconds, large_price_step_bps,
         rate_limit_requests_per_second, rate_limit_burst, sse_heartbeat_seconds, note]
      properties:
        confirmation_blocks: { type: integer, format: int64 }
        price_poll_seconds: { type: integer, format: int64 }
        dm_sweep_interval_seconds: { type: integer, format: int64 }
        dm_sweep_pass_seconds: { type: integer, format: int64 }
        dm_sweep_worst_case_seconds: { type: integer, format: int64 }
        price_budget_seconds: { type: integer, format: int64 }
        price_ceiling_seconds:
          type: integer
          format: int64
          description: Twice the budget. An input past it is REFUSED rather than served stale.
        large_price_step_bps: { type: integer, format: int64 }
        rate_limit_requests_per_second: { type: number }
        rate_limit_burst: { type: integer }
        sse_heartbeat_seconds: { type: integer, format: int64 }
        note: { type: string }

    MetaResponse:
      type: object
      additionalProperties: false
      required:
        [served_at, service, batch, watermark_vector, reorg_posture, prices,
         neutralized_prices, sweeps, sweep_never_refusals_in_batch,
         heartbeat_provenance, constants, disclosures]
      properties:
        served_at: { type: string, format: date-time }
        service: { $ref: "#/components/schemas/Service" }
        batch:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Batch" }]
        batch_unavailable_reason: { type: string }
        watermark_vector:
          type: array
          items: { $ref: "#/components/schemas/Cursor" }
        reorg_posture: { $ref: "#/components/schemas/ReorgPosture" }
        prices:
          type: array
          items: { $ref: "#/components/schemas/PriceState" }
        neutralized_prices:
          type: array
          items: { $ref: "#/components/schemas/Neutralized" }
        sweeps:
          type: array
          items: { $ref: "#/components/schemas/SweepCounts" }
        sweep_never_refusals_in_batch: { type: integer }
        heartbeat_provenance:
          type: array
          items: { $ref: "#/components/schemas/Heartbeat" }
        constants: { $ref: "#/components/schemas/Constants" }
        disclosures:
          type: array
          items: { type: string }

    # -----------------------------------------------------------------------
    # SSE payload
    # -----------------------------------------------------------------------
    StreamPayload:
      type: object
      additionalProperties: false
      required: [served_at, batch, listener_connected, poll_interval_seconds, note]
      description: |
        The `data:` field of every non-heartbeat SSE frame. `engines`,
        `degradation` and `transitions` are present according to the event:
        `snapshot` and `batch` carry engines and degradation; `degradation`
        carries the transition list; `unavailable` carries only a reason.
      properties:
        served_at: { type: string, format: date-time }
        reason: { type: string }
        stale_since_seconds:
          type: integer
          format: int64
          description: |
            On an `unavailable` event raised after the stream had been healthy: how
            long the data the client is still holding has been the last good read.
            Without it a client cannot tell a momentary hiccup from an outage it has
            been rendering through.
        last_good_batch_id:
          type: integer
          format: int64
          description: The batch the client's held state describes, if any.
        recovered:
          type: boolean
          description: |
            Marks the `snapshot` emitted when reads come back after a failure — the
            explicit stale-to-current transition, rather than one a client has to
            infer from whether the batch id happened to move.
        batch:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Batch" }]
        engines:
          type: array
          nullable: true
          items: { $ref: "#/components/schemas/Aggregate" }
        degradation:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Degradation" }]
        transitions:
          type: array
          items: { $ref: "#/components/schemas/Transition" }
        listener_connected:
          type: boolean
          description: Whether the LISTEN doorbell is up. When false the stream runs on its poll fallback and ticks are up to `poll_interval_seconds` late.
        poll_interval_seconds: { type: integer, format: int64 }
        note: { type: string }

    DegradationEngine:
      type: object
      additionalProperties: false
      required: [engine, refused_positions, flagged_positions, liquidatable_positions, sweep, refusals, flags]
      properties:
        engine: { type: string }
        refused_positions: { type: integer }
        flagged_positions: { type: integer }
        liquidatable_positions: { type: integer }
        sweep:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/SweepStamp" }]
          description: |
            This engine's sweep stamp on the batch the posture describes
            (1.2.2). It travels ON THE ROW because the stream envelope's
            `batch` is nullable (`unavailable` frames), so the envelope
            cannot structurally vouch for the liquidatable count beside it.
            Null means the engine HAS no collateral sweep — a recorded
            absence.
        refusals:
          type: array
          items: { $ref: "#/components/schemas/Count" }
        flags:
          type: array
          items: { $ref: "#/components/schemas/Count" }

    Degradation:
      type: object
      additionalProperties: false
      required: [engines, superseded, supersession_legs, refused_engines, note]
      properties:
        engines:
          type: array
          items: { $ref: "#/components/schemas/DegradationEngine" }
        superseded: { type: boolean }
        supersession_legs:
          type: array
          items: { type: string }
        refused_engines:
          type: array
          description: |
            Engines whose WHOLE book is withheld. Part of the degradation POSTURE,
            so entering or leaving that state produces a `degradation` event with a
            transition keyed `engine_refused|<engine>|<code>` rather than a silently
            different-shaped snapshot.
          items: { $ref: "#/components/schemas/EngineRefusal" }
        note: { type: string }

    Transition:
      type: object
      additionalProperties: false
      required: [key, from, to]
      properties:
        key: { type: string }
        from: { type: integer }
        to: { type: integer }

    # -----------------------------------------------------------------------
    # Positions page (batch-stable pagination)
    # -----------------------------------------------------------------------
    TxHash:
      type: string
      pattern: "^0[xX][0-9a-fA-F]{64}$"
      description: A 0x-prefixed 32-byte transaction hash.

    BatchSupersededBody:
      type: object
      additionalProperties: false
      required: [error]
      description: |
        The 409 body for a cursor whose batch is no longer the newest servable
        batch. Its own shape rather than `ErrorBody` because it must NAME both
        batches: a client told only "conflict" cannot distinguish a stale
        cursor from its own bug.
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, cursor_batch_id, current_batch_id]
          properties:
            code:
              type: string
              enum: [batch_superseded]
            message: { type: string }
            cursor_batch_id:
              type: integer
              format: int64
              description: The batch the presented cursor was minted against.
            current_batch_id:
              type: integer
              format: int64
              nullable: true
              description: The batch a restarted pagination would read. Null in the race where no batch is servable at answer time (a retry then meets a 503).

    PositionsResponse:
      type: object
      additionalProperties: false
      required:
        [served_at, batch, engine, sort, limit, refused, refusal,
         total_positions, positions, next_cursor, notes]
      properties:
        served_at: { type: string, format: date-time }
        batch:
          allOf: [{ $ref: "#/components/schemas/Batch" }]
          description: The batch EVERY row on this page was drawn from. `next_cursor` is bound to it.
        engine: { type: string }
        sort:
          type: string
          enum: [liq_distance, debt, hf, status]
          description: The ranking actually applied, echoed so a defaulted request still states its order.
        limit:
          type: integer
          description: The page size actually applied, echoed so a defaulted request still states it.
        refused:
          type: boolean
          description: |
            True when the requested ENGINE's whole book is withheld on this
            batch. `positions` is then empty FOR THAT REASON — never because
            the book is empty — and `total_positions` is null.
        refusal:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/EngineRefusal" }]
        total_positions:
          type: integer
          nullable: true
          description: |
            Rows in this engine's book on this batch, refused rows INCLUDED.
            NULL on a withheld engine, never 0. When `min_value` is present
            this is the QUALIFYING count — the denominator of THIS walk under
            the exclusion law (refused rows and NULL-total rows always
            qualify) — while the unfiltered engine total remains
            `aggregate.positions` on `/v1/book`.
        positions:
          type: array
          description: |
            The page, in `sort` order, as LEAN `PositionSummary` rows
            (AMENDMENT 1/E) — the full `Position` stays on
            `/v1/address/{addr}`. Refused rows are rows here, exactly as they
            are in the aggregates.
          items: { $ref: "#/components/schemas/PositionSummary" }
        next_cursor:
          type: string
          nullable: true
          description: |
            OPAQUE token for the next page, bound to `batch.id`; null on the
            last page. Presenting it after the batch is superseded as the
            newest servable batch answers 409 `batch_superseded`.
        notes:
          type: array
          items: { type: string }

    LiqDistance:
      type: object
      additionalProperties: false
      required: [kind, scale_factor_num, scale_factor_den, factor_asset, reason]
      description: |
        A row's distance to ITS OWN engine's liquidation boundary, lean. The
        exact rational scale factor (num/den) is the wire's statement;
        rendering a percentage from it is display-precision work that belongs
        to the consumer's display layer, never to eligibility decisions.
      properties:
        kind:
          type: string
          enum: [distance, breached, never, none]
          description: |
            `distance` — the factor-level closed-form solve holds; the exact
            scale-factor rational is served. `breached` — the boundary is
            behind the current price, or the engine's own verdict already
            says liquidatable. `never` — no finite down-move on the axis
            reaches the boundary. `none` — no distance is published (refused
            row, no reconstructable solve, or an out-of-factor position);
            `reason` names why when the service knows.
        scale_factor_num:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
          description: "Non-null exactly on kind `distance` — the boundary price multiple's exact numerator."
        scale_factor_den: { $ref: "#/components/schemas/NullableDecimal" }
        factor_asset:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Address" }]
          description: The axis's leading factor asset, when a distance is served.
        factor_symbol: { type: string }
        reason:
          type: string
          nullable: true
          description: Why no distance is served (`never`/`none`), when known. Null otherwise — never invented.

    PositionSummary:
      type: object
      additionalProperties: false
      required:
        [engine, account, status, value_decimals, refusal, flags,
         health_factor, liquidatable, total_collateral, total_debt,
         liq_distance, balances_block, params_block, sweep_block]
      description: |
        The lean `/v1/positions` row (AMENDMENT 1/E): engine, account, status,
        named refusal, health factor, the engine's own strict verdict, totals
        in the engine's OWN unit, boundary distance, and the as-of marks. The
        FULL `Position` — legs, price inputs, the liquidation-price solve and
        per-input provenance — is served by `/v1/address/{addr}`.
      properties:
        engine: { type: string }
        account: { $ref: "#/components/schemas/Address" }
        status: { type: string, enum: [computed, refused] }
        value_decimals:
          type: integer
          description: The scale of `total_collateral`/`total_debt` — the ENGINE's own decimals (Aave base 8, Debt Manager USD 6).
        refusal:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Refusal" }]
        flags:
          type: array
          items: { type: string }
        health_factor:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/HealthFactor" }]
        liquidatable:
          type: boolean
          nullable: true
          description: The Debt Manager's strict verdict. Null on Aave (the pool publishes a continuous health factor, not a strict boolean) and on refused rows — a withheld verdict, never "false".
        total_collateral:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
          description: The engine's OWN total at `value_decimals` — Aave's base-currency total, the Debt Manager's swept USD collateral value. Null stays null; never rendered as 0.
        total_debt:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
          description: The engine's OWN debt total at `value_decimals` — Aave's base-currency debt, the Debt Manager's borrowings.
        liq_distance: { $ref: "#/components/schemas/LiqDistance" }
        balances_block: { type: integer, format: int64 }
        params_block: { type: integer, format: int64 }
        sweep_block:
          type: integer
          format: int64
          description: 0 on engines without a sweeper (Aave), and 0 for a Debt Manager account that has never been swept — an ABSENT sweep, rendered visibly, never as "swept at genesis".

    # -----------------------------------------------------------------------
    # Address history
    # -----------------------------------------------------------------------
    AddressHistoryPoint:
      type: object
      additionalProperties: false
      required:
        [batch_id, computed_at, balances_block, sweep_block, status, refusal,
         health_factor, liquidatable, total_collateral_base, total_debt_base]
      description: |
        One PERSISTED batch row for the address on one engine. A refused batch
        is a point, not a gap: the position existed and could not honestly be
        valued, and this history preserves that distinction.
      properties:
        batch_id: { type: integer, format: int64 }
        computed_at: { type: string, format: date-time }
        balances_block: { type: integer, format: int64 }
        sweep_block:
          type: integer
          format: int64
          description: |
            The account's own last successful collateral sweep AS PERSISTED IN
            THIS POINT's batch — the collateral clock behind this point's
            `liquidatable` verdict (worst-case ~1.5h behind the 60-second
            price samples), carried per point exactly as `PositionSummary`
            carries it per row. 0 on engines without a sweeper (Aave), and 0
            for a Debt Manager account that had never been swept at that
            batch — an ABSENT sweep, rendered visibly, never as "swept at
            genesis". A history point serves a verdict from ITS OWN batch, so
            the newest batch's envelope watermarks cannot vouch for it; the
            verdict without this per-point watermark would be a mixed-clock
            boolean wearing pin truth.
        status: { type: string, enum: [computed, refused] }
        refusal:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Refusal" }]
        health_factor:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/HealthFactor" }]
        liquidatable:
          type: boolean
          nullable: true
          description: The Debt Manager's strict verdict at that batch. Null on Aave, and null on a refused row — a withheld verdict, never "false".
        total_collateral_base: { $ref: "#/components/schemas/NullableDecimal" }
        total_debt_base: { $ref: "#/components/schemas/NullableDecimal" }

    AddressHistoryEngine:
      type: object
      additionalProperties: false
      required: [engine, value_decimals, points, withheld_batch_ids, note]
      properties:
        engine: { type: string }
        value_decimals: { type: integer }
        points:
          type: array
          description: Newest batch first.
          items: { $ref: "#/components/schemas/AddressHistoryPoint" }
        withheld_batch_ids:
          type: array
          description: |
            Batches in the covered window where this ENGINE's whole book was
            withheld. Such a batch has no row for ANY account on the engine, so
            a missing point at one of these ids means "could not be
            established" — never "no position at that batch". Without this
            list, an engine-wide refusal would be indistinguishable from an
            account that closed its position.
          items: { type: integer, format: int64 }
        note: { type: string }

    AddressHistoryResponse:
      type: object
      additionalProperties: false
      required:
        [served_at, batch, address, limit, engines, found, lookup_complete,
         withheld_engines, lookup_complete_note, notes]
      properties:
        served_at: { type: string, format: date-time }
        batch:
          allOf: [{ $ref: "#/components/schemas/Batch" }]
          description: The NEWEST servable batch — the vantage this history is served from. Each point carries its own batch identity.
        address: { $ref: "#/components/schemas/Address" }
        limit: { type: integer }
        engines:
          type: array
          items: { $ref: "#/components/schemas/AddressHistoryEngine" }
        found:
          type: boolean
          nullable: true
          description: |
            THREE-VALUED, with the same contract as `/v1/address`, evaluated
            over the covered window: `true` — at least one persisted point
            exists; `false` — a definitive negative, every engine consultable
            in every covered batch and no row anywhere; `null` — the answer
            cannot be established, because an engine's book was withheld
            somewhere in the window. **Never render null as "no position".**
        lookup_complete: { type: boolean }
        withheld_engines:
          type: array
          description: Engines withheld in the NEWEST servable batch. Per-batch holes inside the window are named per series in `withheld_batch_ids`.
          items: { $ref: "#/components/schemas/EngineRefusal" }
        lookup_complete_note: { type: string }
        notes:
          type: array
          items: { type: string }

    # -----------------------------------------------------------------------
    # Events feed
    # -----------------------------------------------------------------------
    EventDisplayType:
      type: string
      enum:
        [borrow, repay, supply, withdraw, liquidation, collateral_enabled,
         collateral_disabled, deficit_created]
      description: |
        The closed DISPLAY vocabulary — this feed's slice of the store's wider
        display classification. Every raw event type in each engine's closed
        set either maps here or is EXPLICITLY excluded with its reason
        recorded — the mapping is total, and an unmapped raw type is a
        service failure, never a silent omission.

        THE VOCABULARY BRIDGE (owned by the server's closed maps, welded to
        the store's classification): the store classifies every raw type into
        display classes; this contract deliberately narrows the FEED to user
        chain actions. The store classes `transfer` (aToken balance transfers
        between users), `migration` (V1→V2 migration-genesis imports) and
        `config` (parameter changes) are NOT feed rows here — transfers and
        migration imports are treated as bookkeeping on this surface, and
        parameter changes are served by `/v1/params`. The store's `bad_debt`
        class serves here as `deficit_created`. An unmapped class reaching a
        served row is a loud 500 (vocabulary drift), never a mislabeled row.

        Mapping: `borrow` ⇐ aave_borrow, borrow · `repay` ⇐ aave_repay, repay ·
        `supply` ⇐ aave_supply, supplied · `withdraw` ⇐ aave_withdraw,
        withdraw_borrow_token · `liquidation` ⇐ aave_liquidation_call,
        liquidation (the Debt Manager's per-collateral seizure fan-out rows
        fold into the liquidation row's `seized` extract) ·
        `collateral_enabled`/`collateral_disabled` ⇐ the Aave usage-as-
        collateral toggles · `deficit_created` ⇐ aave_deficit_created, the
        pool's own bad-debt realization event.

        Store-side bookkeeping (never display rows anywhere): aToken mints,
        burns and record-only transfers (balance mechanics behind a
        supply/withdraw/liquidation), rate-index updates, Debt Manager residue
        zeroing, and the liquidation_collateral seizure fan-out (consumed by
        the liquidation extract).

    EventAmountUnit:
      type: string
      enum: [none, dm_normalized_debt, aave_scaled, opaque]
      description: |
        The closed SEMANTIC UNIT of a row's `amount` — established from the
        deriver source per raw type, never assumed (verbatim from the store's
        unit vocabulary). The engines' internal accounting units are NOT
        user-display token amounts:

          * `dm_normalized_debt` — Debt Manager normalized debt units (18-dec
            normalized; the USD-6 view is value × interest index ÷ 1e18 at
            the event's index).
          * `aave_scaled` — Aave ray-scaled aToken/variableDebtToken units
            (nominal token amount = rayMul(scaled, live index)).
          * `none` — the row is record-only (`amount` is null); any amounts it
            carries are payload facts with their own documented units.
          * `opaque` — the fail-honest tag for a delta whose unit could not be
            established from the deriver source. Render the raw integer
            verbatim; even decimals would be an interpretation.

        A renderer that showed an `amount` as a token amount would misstate
        both engines; this tag is what lets it be labeled honestly. Nothing
        here is ever a USD figure.

    SeizedCollateral:
      type: object
      additionalProperties: false
      required: [asset, amount, decimals, bonus]
      properties:
        asset: { $ref: "#/components/schemas/Address" }
        symbol: { type: string }
        amount: { $ref: "#/components/schemas/Decimal" }
        decimals: { type: integer }
        bonus:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
          description: |
            The realized bonus the CONTRACT ITSELF recorded for this seizure
            element, verbatim from the event payload, in the Debt Manager's
            OWN 100e18 percent denomination — NOT bps, and never
            unit-converted here. Null on Aave rows: the pool publishes no
            per-seizure realized bonus.

    LiquidationDetail:
      type: object
      additionalProperties: false
      required:
        [liquidator, debt_asset, debt_repaid, debt_decimals, before_debt_usd,
         interest_index, deficit_paired, seized, realized_bonus_bps,
         configured_bonus_bps, note]
      description: |
        The typed extract from a liquidation event's own structured payload.
        Nothing here is inferred: a field the payload does not establish is
        null, never estimated. Engine-specific fields are null on the other
        engine's rows — the two engines' liquidation semantics are never
        blended.
      properties:
        liquidator: { $ref: "#/components/schemas/Address" }
        debt_asset:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Address" }]
        debt_repaid: { $ref: "#/components/schemas/NullableDecimal" }
        debt_decimals: { type: integer, nullable: true }
        before_debt_usd:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
          description: The Debt Manager's own pre-liquidation debt figure (USD 6-dec), verbatim from the event payload. Null on Aave rows — the pool's event carries no such figure.
        interest_index:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
          description: The Debt Manager's interest index AT THIS EVENT, verbatim from the payload (1e18 scale; the USD-6 view of a normalized amount is value × index ÷ 1e18). Null on Aave rows.
        deficit_paired:
          type: boolean
          nullable: true
          description: |
            Aave only — true when this liquidation shares its transaction
            with a DeficitCreated event (the debt write-off lives on the
            `deficit_created` row, not this one). Null on Debt Manager rows:
            the engine has no deficit-pairing concept, and null is a withheld
            statement, never "false".
        seized:
          type: array
          description: Every collateral asset seized in this liquidation, one row per asset (the Debt Manager's seizure fan-out folds in here; a zero-amount tuple element enumerates untouched collateral and is not a seizure row).
          items: { $ref: "#/components/schemas/SeizedCollateral" }
        realized_bonus_bps:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
          description: The bonus the liquidator actually realized, in bps, ONLY when the payload's own facts establish it in bps. Neither engine's payload does today (the Debt Manager records its realized bonus per seizure element in its 100e18 denomination — served verbatim on `seized[].bonus` — and Aave's would need event-time prices this service does not re-read), so it is null — never estimated, never unit-converted into a plausible-looking number.
        configured_bonus_bps:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
          description: The configured bonus AT THIS EVENT's effective params (from the param timeline), not today's. Aave publishes bps; the Debt Manager's denomination is 100e18, not bps, so its rows serve null rather than a silent unit conversion. Null too when param custody does not cover the event's block.
        note: { type: string }

    ChainEvent:
      type: object
      additionalProperties: false
      required:
        [chain_id, engine, block_number, block_time, tx_hash, log_index, seq,
         type, raw_type, account, asset, amount, amount_unit, amount_decimals,
         liquidation]
      properties:
        chain_id: { type: integer, format: int64 }
        engine: { type: string }
        block_number: { type: integer, format: int64 }
        block_time:
          type: string
          format: date-time
          nullable: true
          description: |
            The block's HEADER time under block-header custody — chain-asserted
            or absent. NULL until the header is custodied: header time is never
            fabricated, and a database clock is never substituted for it.
            Render the block number while this is null.
        tx_hash: { $ref: "#/components/schemas/TxHash" }
        log_index: { type: integer, format: int64 }
        seq:
          type: integer
          format: int64
          description: Intra-log sequence for events one log fans out into. 0 for ordinary events.
        type: { $ref: "#/components/schemas/EventDisplayType" }
        raw_type:
          type: string
          description: The engine's own event type, verbatim from custody (e.g. `aave_liquidation_call`, `borrow`).
        account: { $ref: "#/components/schemas/Address" }
        asset:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Address" }]
          description: Null on rows that carry no asset (e.g. a collateral-usage toggle).
        symbol: { type: string }
        amount:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
          description: |
            The SIGNED custodied delta in the ENGINE's own ACCOUNTING unit,
            verbatim — named by `amount_unit`, NOT a display-ready token
            amount (a repay is negative on the debt side). Null on
            record-only rows. Zero and null are different statements.
        amount_unit:
          allOf: [{ $ref: "#/components/schemas/EventAmountUnit" }]
          description: The closed semantic unit of `amount` — the store's own per-raw-type classification, verbatim.
        amount_decimals:
          type: integer
          nullable: true
          description: |
            Null on every row this contract serves: `amount` is the engine's
            own accounting delta (see `amount_unit`), and asserting a token
            display scale for it would misstate both engines. "No display
            scale is asserted for this figure."
        liquidation:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/LiquidationDetail" }]
          description: The typed per-class extract. Non-null exactly when `type` is `liquidation`.

    EventFilter:
      type: object
      additionalProperties: false
      required: [engine, account, types, since_block]
      description: The filter actually applied, echoed so a defaulted request still states its scope.
      properties:
        engine: { type: string, nullable: true }
        account:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Address" }]
        types:
          type: array
          description: Empty means every display type.
          items: { $ref: "#/components/schemas/EventDisplayType" }
        since_block: { type: integer, format: int64, nullable: true }

    EventsResponse:
      type: object
      additionalProperties: false
      required: [served_at, filter, limit, events, next_cursor, notes]
      properties:
        served_at: { type: string, format: date-time }
        filter: { $ref: "#/components/schemas/EventFilter" }
        limit:
          type: integer
          description: The page size actually applied, echoed so a defaulted request still states it.
        events:
          type: array
          description: |
            Engine-scoped pages: ordered (block_number, tx_hash, log_index,
            seq) DESC — exact within one chain. Cross-engine pages: ordered
            by custodied block_time DESC with the chain-aware tiebreak; rows
            without a custodied time form a DISCLOSED untimed tail AFTER
            every timed row. Two chains' block numbers are never comparable
            as time.
          items: { $ref: "#/components/schemas/ChainEvent" }
        next_cursor:
          type: string
          nullable: true
          description: OPAQUE keyset token for the next page; null when the feed is exhausted under the filter.
        notes:
          type: array
          items: { type: string }

    # -----------------------------------------------------------------------
    # Parameter timeline
    # -----------------------------------------------------------------------
    ParamField:
      type: object
      additionalProperties: false
      required: [name, value, address, prior, unit]
      description: |
        One field ONE EVENT spoke to. Exactly one of `value` and `address` is
        non-null (a risk parameter is numeric; a token/strategy binding is an
        address). The ledger is append-only: a field the event did not mention
        is absent from the row entirely, never back-filled.
      properties:
        name:
          type: string
          description: e.g. `ltv`, `liq_threshold`, `liq_bonus`, `emode_category`, `atoken`, `variable_debt_token`, `strategy`, `borrow_apy`, or a Debt Manager config field.
        value: { $ref: "#/components/schemas/NullableDecimal" }
        address:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Address" }]
        prior:
          allOf: [{ $ref: "#/components/schemas/NullableDecimal" }]
          description: The prior value THE EVENT ITSELF carried, when it carried one. Null otherwise — a prior is never reconstructed by ledger lookback into this field.
        unit:
          type: string
          description: The ENGINE's own denomination, named per field — e.g. `bps` (Aave, 1e4 scale), `per-second-1e18`, `address`, `count`. No cross-engine normalization exists.

    ParamChange:
      type: object
      additionalProperties: false
      required:
        [engine, chain_id, asset, fields, effective_block, effective_log_index,
         source_event, tx_hash, block_time]
      properties:
        engine: { type: string }
        chain_id: { type: integer, format: int64 }
        asset:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Address" }]
          description: Null on an engine-global change (e.g. the Debt Manager's borrow APY).
        symbol: { type: string }
        fields:
          type: array
          items: { $ref: "#/components/schemas/ParamField" }
        effective_block: { type: integer, format: int64 }
        effective_log_index: { type: integer, format: int64 }
        source_event:
          type: string
          description: The chain event this row was derived from, verbatim (e.g. `CollateralConfigurationChanged`, `borrow_apy_set`).
        tx_hash: { $ref: "#/components/schemas/TxHash" }
        block_time:
          type: string
          format: date-time
          nullable: true
          description: Header time under block-header custody; null until custodied, never fabricated.

    ParamsResponse:
      type: object
      additionalProperties: false
      required: [served_at, engine, asset, params, next_cursor, notes]
      properties:
        served_at: { type: string, format: date-time }
        engine:
          type: string
          nullable: true
          description: The engine filter applied, or null for both.
        asset:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Address" }]
          description: The asset filter applied, or null for all.
        params:
          type: array
          description: Ordered (effective_block, effective_log_index) DESC, interleaved across engines by block DESC.
          items: { $ref: "#/components/schemas/ParamChange" }
        next_cursor:
          type: string
          nullable: true
          description: OPAQUE keyset token; null when the timeline is exhausted under the filter.
        notes:
          type: array
          items: { type: string }

    # -----------------------------------------------------------------------
    # Price history
    # -----------------------------------------------------------------------
    PricePoint:
      type: object
      additionalProperties: false
      required: [block_number, value, anchor_block, source_as_of, valid, invalid_reason]
      properties:
        block_number: { type: integer, format: int64 }
        value: { $ref: "#/components/schemas/NullableDecimal" }
        anchor_block:
          type: integer
          format: int64
          nullable: true
          description: The poll anchor binding this observation to a custodied block hash, when one survives. Null is a provenance statement, not a gap to hide.
        source_as_of:
          type: string
          format: date-time
          nullable: true
          description: The chain-asserted as-of. Database insert time is never substituted; null means the row carries none.
        valid: { type: boolean }
        invalid_reason:
          type: string
          description: Named when `valid` is false; empty when valid. A quarantined row is RETAINED and served with its reason — never deleted, never smoothed away.

    QuarantinedRange:
      type: object
      additionalProperties: false
      required: [from_block, to_block, rows, reasons]
      description: A contiguous block range of quarantined rows in this series, summarized so a renderer cannot miss it even when `step` skips the rows themselves.
      properties:
        from_block: { type: integer, format: int64 }
        to_block: { type: integer, format: int64 }
        rows: { type: integer, format: int64 }
        reasons:
          type: array
          items: { $ref: "#/components/schemas/Count" }

    PriceSeries:
      type: object
      additionalProperties: false
      required:
        [chain_id, asset, source, owner_engine, provenance, decimals, points,
         quarantined_ranges, note]
      properties:
        chain_id: { type: integer, format: int64 }
        asset: { $ref: "#/components/schemas/Address" }
        symbol: { type: string }
        source: { type: string }
        owner_engine: { type: string }
        provenance:
          type: string
          description: engine-exact, adapter-output, uncapped-feed or ratio-reference — derived from the source key, same vocabulary as `/v1/meta`.
        decimals: { type: integer }
        points:
          type: array
          description: Ascending by block. Every point is an EXACT custodied row — downsampling selects, it never averages, and never across a validity boundary.
          items: { $ref: "#/components/schemas/PricePoint" }
        quarantined_ranges:
          type: array
          items: { $ref: "#/components/schemas/QuarantinedRange" }
        note: { type: string }

    PricesResponse:
      type: object
      additionalProperties: false
      required: [served_at, asset, source, from_block, to_block, step, chains, series, notes]
      properties:
        served_at: { type: string, format: date-time }
        asset: { $ref: "#/components/schemas/Address" }
        source: { type: string, nullable: true }
        from_block: { type: integer, format: int64, nullable: true }
        to_block: { type: integer, format: int64, nullable: true }
        step: { type: integer, format: int64, nullable: true }
        chains:
          type: array
          description: |
            The CUSTODY CHAINS this answer consulted, by chain id — the
            response's chain identity. Every served series names its own
            `chain_id` from this set; an empty `series` still states exactly
            where custody was looked for, so "no observations" can never be
            mistaken for "one chain was never asked".
          items: { type: integer, format: int64 }
        series:
          type: array
          description: One series per (chain_id, source) key holding rows for this asset. Empty is a statement about CUSTODY, not a claim the asset has no price.
          items: { $ref: "#/components/schemas/PriceSeries" }
        notes:
          type: array
          items: { type: string }

    # -----------------------------------------------------------------------
    # Book-wide scenario run
    # -----------------------------------------------------------------------
    RunBookAggregate:
      type: object
      additionalProperties: false
      required:
        [accounts, eligible_accounts, total_collateral_usd, total_debt_usd,
         eligible_debt_usd, collateral_at_risk_usd, bad_debt_usd]
      description: One engine's book reduced at one side of the shock, in the engine's OWN unit and decimals. Never summed across engines.
      properties:
        accounts: { type: integer }
        eligible_accounts: { type: integer }
        total_collateral_usd: { $ref: "#/components/schemas/Decimal" }
        total_debt_usd: { $ref: "#/components/schemas/Decimal" }
        eligible_debt_usd:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: Debt ELIGIBLE for liquidation. Realized is less than or equal to eligible.
        collateral_at_risk_usd: { $ref: "#/components/schemas/Decimal" }
        bad_debt_usd: { $ref: "#/components/schemas/Decimal" }

    RunBookEngine:
      type: object
      additionalProperties: false
      required:
        [engine, usd_decimals, before, after, newly_eligible_accounts,
         eligible_debt_delta_usd, bad_debt_delta_usd, market_realization,
         projection, note]
      properties:
        engine: { type: string }
        usd_decimals: { type: integer }
        before: { $ref: "#/components/schemas/RunBookAggregate" }
        after: { $ref: "#/components/schemas/RunBookAggregate" }
        newly_eligible_accounts: { type: integer }
        eligible_debt_delta_usd:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: DELTA-ONLY — after minus before, the scenario's own contribution over the positions in the run. Can be negative.
        bad_debt_delta_usd:
          allOf: [{ $ref: "#/components/schemas/Decimal" }]
          description: DELTA-ONLY, same basis.
        market_realization:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Shortfall" }]
          description: Present when the scenario carries a market-realization axis; its `hfs_unchanged` asserts that no oracle mark moved.
        projection:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/Projection" }]
          description: Present on rate scenarios — a PROJECTION over time on the delta-only basis, never a spot shock.
        note: { type: string }

    RunBookResponse:
      type: object
      additionalProperties: false
      required:
        [served_at, batch, scenario_config_version, scenario_id,
         scenario_version, label, description, path_assumption, shocks,
         out_of_model, applied_shocks, held_flat, engines, excluded_engines,
         coverage, notes]
      properties:
        served_at: { type: string, format: date-time }
        batch: { $ref: "#/components/schemas/Batch" }
        scenario_config_version: { type: string }
        scenario_id: { type: string }
        scenario_version: { type: string }
        label: { type: string }
        description: { type: string }
        path_assumption: { type: string }
        shocks:
          type: array
          items: { $ref: "#/components/schemas/Shock" }
        out_of_model:
          type: array
          items: { type: string }
        applied_shocks:
          type: array
          items: { $ref: "#/components/schemas/AppliedShock" }
        held_flat:
          type: array
          description: Every price input no propagation row described, book-wide. Empty is the claim that the matrix covered the whole run.
          items: { $ref: "#/components/schemas/HeldFlat" }
        engines:
          type: array
          items: { $ref: "#/components/schemas/RunBookEngine" }
        excluded_engines:
          type: array
          description: Engines whose WHOLE book is withheld. Absent from `engines` entirely — and named here so the absence cannot be silent.
          items: { $ref: "#/components/schemas/EngineRefusal" }
        coverage:
          allOf: [{ $ref: "#/components/schemas/BookCoverage" }]
          description: The audit of what reached the run's arithmetic — the same fail-closed coverage claim `/v1/book` carries.
        notes:
          type: array
          items: { type: string }

    # -----------------------------------------------------------------------
    # Observatory rollup series
    # -----------------------------------------------------------------------
    ObservatorySeriesPoint:
      type: object
      additionalProperties: false
      required:
        [bucket_start, last_block, batch_id, materialization_key,
         acked_epoch, max_epoch_at_compute, sweep_recorded, sweep,
         refused, refusal_code, accounts,
         refused_positions, liquidatable_positions, debt_usd, collateral_usd,
         rates]
      properties:
        bucket_start: { type: string, format: date-time }
        last_block:
          type: integer
          format: int64
          description: The engine's balances watermark at capture time — the bucket's own as-of, never a chain head observed later.
        batch_id:
          type: integer
          format: int64
          description: The COMPLETE risk batch this bucket observed. The batch itself may since have been pruned by retention; the id remains the observation's provenance.
        materialization_key:
          type: string
          description: The observed batch's deterministic materialization key, copied at write time — it survives batch retention, so the observation stays attributable after the batch is pruned.
        acked_epoch:
          type: integer
          format: int64
          description: The engine's acknowledged reorg epoch in the observed batch's watermark vector, copied at write time.
        max_epoch_at_compute:
          type: integer
          format: int64
          description: The chain's max recorded reorg epoch at the observed batch's compute time. A gap above `acked_epoch` means the bucket was captured under an unacknowledged reorg — the reorg-honesty stamp pair travels with the point.
        sweep_recorded:
          type: boolean
          description: |
            Whether the observed batch's SWEEP STAMP was captured with this
            point (1.2.2, migration 00018). False ONLY on points written
            before 00018 whose observed batch retention had already pruned
            when the migration's backfill ran: the store genuinely cannot
            know what stamp that batch carried, and this flag discloses the
            absence rather than letting it impersonate "this engine has no
            sweeper". Every point captured under 00018 is true.
        sweep:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/SweepStamp" }]
          description: |
            The engine's sweep stamp in the observed batch's watermark
            vector, copied at capture time — the same `SweepStamp` the batch
            envelope's `Stamp.sweep` serves, so the bucket's
            `liquidatable_positions` count travels with the sweep-cut it
            aggregates (Debt Manager collateral is sweep-sourced and
            worst-case ~1.5h behind the bucket's block clock). Null carries
            TWO disclosed absences, split by `sweep_recorded`: when
            `sweep_recorded` is true, null means the engine HAS no collateral
            sweep (Aave); when false, null means the record predates 00018
            and is genuinely unrecoverable — never a claim about the engine.
            `age_seconds` inside the stamp is the database clock at SERVE
            time minus the stamp — the stamp itself is immutable capture-time
            evidence.
        refused:
          type: boolean
          description: True when the engine's whole book was withheld at capture time. Totals are then null FOR THAT REASON, never 0.
        refusal_code:
          type: string
          nullable: true
          description: The engine refusal code behind a withheld bucket (e.g. FLAG_CUSTODY_UNPROVEN). Null when `refused` is false.
        accounts: { type: integer, nullable: true }
        refused_positions:
          type: integer
          description: Refused POSITION ROWS in the bucket. Zero on a withheld engine with no rows behind it — which is why `refused` exists on the point itself.
        liquidatable_positions: { type: integer, nullable: true }
        debt_usd: { $ref: "#/components/schemas/NullableDecimal" }
        collateral_usd: { $ref: "#/components/schemas/NullableDecimal" }
        rates:
          type: array
          description: The rate-index snapshot captured with the bucket. Each index carries its OWN as-of block.
          items: { $ref: "#/components/schemas/RateIndex" }

    ObservatorySeriesResponse:
      type: object
      additionalProperties: false
      required: [served_at, engine, usd_decimals, from, to, step_seconds, points, notes]
      properties:
        served_at: { type: string, format: date-time }
        engine: { type: string }
        usd_decimals: { type: integer }
        from: { type: string, format: date-time, nullable: true }
        to: { type: string, format: date-time, nullable: true }
        step_seconds:
          type: integer
          nullable: true
          description: The stride actually applied; null when every native bucket is served. A stride serves every Nth captured bucket VERBATIM — never an average.
        points:
          type: array
          description: Oldest first.
          items: { $ref: "#/components/schemas/ObservatorySeriesPoint" }
        notes:
          type: array
          items: { type: string }

    # -----------------------------------------------------------------------
    # Batch permalink
    # -----------------------------------------------------------------------
    BatchAggregate:
      type: object
      additionalProperties: false
      required:
        [engine, value_decimals, positions, computed_positions,
         refused_positions, flagged_positions, liquidatable_positions,
         sweep, total_collateral, total_debt, refusal]
      description: |
        One engine's persisted rollup on one batch, lean. A WITHHELD engine's
        aggregate serves NULL totals and names its refusal — the persisted
        zeros behind a refusal mean WITHHELD, and republishing them as values
        is exactly how an unproven book becomes "nothing at risk".
      properties:
        engine: { type: string }
        value_decimals: { type: integer }
        positions: { type: integer }
        computed_positions: { type: integer }
        refused_positions: { type: integer }
        flagged_positions: { type: integer }
        liquidatable_positions:
          type: integer
          nullable: true
          description: Null on a withheld engine — a withheld book has no publishable liquidatable count, and 0 would be a claim.
        sweep:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/SweepStamp" }]
          description: |
            This engine's sweep stamp on THIS batch's watermark vector
            (1.2.2), read from the batch's own persisted
            `risk_batch_watermarks` row — the same `SweepStamp` the batch
            envelope's `Stamp.sweep` serves. The permalink's rollups speak
            for the batch's OWN clock, which the live response envelope
            cannot vouch for, so the sweep-cut behind
            `liquidatable_positions` is named here. Null means the engine
            HAS no collateral sweep (Aave) — never "unrecorded": watermark
            rows are retained exactly as long as their batch, so a served
            aggregate always has its stamp. `age_seconds` inside the stamp
            is the database clock at serve time minus the stamp.
        total_collateral: { $ref: "#/components/schemas/NullableDecimal" }
        total_debt: { $ref: "#/components/schemas/NullableDecimal" }
        refusal:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/EngineRefusal" }]

    BatchResponse:
      type: object
      additionalProperties: false
      required:
        [served_at, batch_id, servability, servability_note, computed_at,
         producer, status, position_count, refused_count, flagged_count,
         materialization_key, substrate_digest, aggregates, notes]
      description: |
        One batch's permanent identity record. Everything here is the batch's
        OWN immutable row — nothing is recomputed — plus the live servability
        verdict relative to the newest servable batch.
      properties:
        served_at: { type: string, format: date-time }
        batch_id: { type: integer, format: int64 }
        servability:
          type: string
          enum: [newest_servable, superseded_retained, unservable_incomplete]
        servability_note: { type: string }
        computed_at: { type: string, format: date-time }
        producer: { type: string }
        status: { type: string }
        position_count: { type: integer }
        refused_count: { type: integer }
        flagged_count: { type: integer }
        materialization_key:
          type: string
          description: The batch's deterministic materialization identity — the same key /v1/evidence publishes for the serving batch.
        substrate_digest:
          type: string
          description: Computed over the batch's INPUTS. Empty string when the batch predates substrate-digest custody — an honest gap, not a digest.
        aggregates:
          type: array
          nullable: true
          description: |
            The batch's per-engine rollups. NULL (not empty) on
            `unservable_incomplete` — an incomplete batch's rollups may be
            torn, and this surface withholds them with the reason in
            `servability_note` rather than serving a plausible-looking
            rollup.
          items: { $ref: "#/components/schemas/BatchAggregate" }
        notes:
          type: array
          items: { type: string }

    # -----------------------------------------------------------------------
    # Evidence manifest
    # -----------------------------------------------------------------------
    SubstrateRef:
      type: object
      additionalProperties: false
      required: [batch_id, materialization_key, substrate_digest, note]
      description: |
        The newest servable batch's deterministic identity. The
        materialization key is unique per materialization; the substrate
        digest is computed over the batch's INPUTS (risk rows, consulted
        prices, consulted collateral flags), so two batches with equal digests
        were computed from identical evidence.
      properties:
        batch_id: { type: integer, format: int64 }
        materialization_key: { type: string }
        substrate_digest:
          type: string
          description: Empty string when the batch predates substrate-digest custody — an honest gap, not a digest.
        note: { type: string }

    FeedsRegistry:
      type: object
      additionalProperties: false
      required: [path, registry_fingerprint, file_sha256, note]
      properties:
        path: { type: string }
        registry_fingerprint:
          type: string
          description: Computed over the ASSEMBLED registry (sorted per-feed identity lines) — the identity batches are bound to. Identical to `service.registry_fingerprint` by construction.
        file_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: SHA-256 of the committed registry file's bytes, as deployed.
        note: { type: string }

    ReconcileWeld:
      type: object
      additionalProperties: false
      required: [engine, rows_compared, rows_exact]
      properties:
        engine: { type: string }
        rows_compared: { type: integer }
        rows_exact: { type: integer }

    ReconcileSummary:
      type: object
      additionalProperties: false
      required:
        [schema, result, exit_code, finished_at, gated_rows, gated_exact,
         gated_drift, advisory_rows, welds, comparison_sha256, artifact_path,
         note]
      description: |
        The last COMMITTED reconcile receipt's summary — read from the
        committed drift-report artifact, never recomputed at request time. The
        reconcile ran against pinned blocks; this is its record, not a live
        claim.
      properties:
        schema:
          type: string
          description: The artifact's self-declared schema, e.g. `solvent.reconcile.drift-report/v1`.
        result:
          type: string
          description: The artifact's own verdict — `pass` when every gated row welded exact.
        exit_code:
          type: integer
          description: "The run's exit code: 0 pass, 1 verdict fail, 2 precondition, 3 retryable, 4 usage."
        finished_at: { type: string, format: date-time }
        gated_rows: { type: integer }
        gated_exact: { type: integer }
        gated_drift: { type: integer }
        advisory_rows: { type: integer }
        welds:
          type: array
          items: { $ref: "#/components/schemas/ReconcileWeld" }
        comparison_sha256:
          type: string
          description: The artifact's own content hash over its hash-scoped sections, so the summary served here can be checked against the committed file.
        artifact_path: { type: string }
        note: { type: string }

    ProbeRecord:
      type: object
      additionalProperties: false
      required: [path, note]
      properties:
        path:
          type: string
          description: Repository path of a committed probe record. Probe records name endpoints by ENVIRONMENT VARIABLE only — publishable by construction.
        note: { type: string }

    ProofSubject:
      type: object
      additionalProperties: false
      required: [status, detail, pin]
      description: |
        THE SPLIT IS THE PRODUCT (AMENDMENT 1): a manifest carries TWO
        subjects and they are never one identity. The PROOF subject is the
        pinned, exactly-reproducible acceptance evidence — the committed
        reconcile receipt (served whole in `reconcile`) plus the build/config
        identity it speaks for. `status` is the server's evaluation of the
        receipt's OWN strict conjunction, and the same conjunction is
        re-derivable from the served `reconcile` fields — a consumer that
        finds the two in contradiction must render the contradiction loudly,
        never the badge:

          accepted    ⇔ result "pass" AND exit_code 0 AND gated_drift 0 AND
                        gated_exact == gated_rows AND every weld
                        rows_exact == rows_compared
          rejected    — a receipt exists but fails the conjunction (an
                        internally inconsistent receipt — a "pass" with
                        drift — is REJECTED, never laundered into a proof);
                        `detail` names the violated conjunct
          unavailable — no committed receipt artifact in this deployment;
                        `detail` carries the reason

        The proof speaks for its pin and ONLY its pin: the currently-serving
        batch is the LIVE subject and never inherits this exactness.
      properties:
        status:
          type: string
          enum: [accepted, rejected, unavailable]
        detail:
          type: string
          description: Why the receipt is rejected or unavailable — the violated conjunct or the absence reason. Empty exactly when `status` is `accepted`.
        pin:
          type: string
          nullable: true
          description: The receipt's own `comparison_sha256` — the proof's pin. Non-null whenever a receipt is present (accepted OR rejected); null when unavailable.

    LiveSubject:
      type: object
      additionalProperties: false
      required: [status, reason]
      description: |
        The LIVE subject: the currently-serving batch's identity (`substrate`
        carries it — batch id, materialization key, substrate digest) under
        its watermark vector. It is OPERATIONAL unconditionally — it never
        wears the proof subject's exactness, and no comparator applies
        between the two subjects.
      properties:
        status:
          type: string
          enum: [serving, no_batch]
          description: "`serving` — `substrate` names the newest servable batch. `no_batch` — no complete batch is servable; a first-class state, not an error."
        reason:
          type: string
          description: Why no batch is servable (`substrate_unavailable_reason`, mirrored). Empty exactly when `status` is `serving`.

    EvidenceResponse:
      type: object
      additionalProperties: false
      required:
        [served_at, service, commit, proof_subject, live_subject, substrate,
         feeds_registry, reconcile, probe_records, notes]
      properties:
        served_at: { type: string, format: date-time }
        service: { $ref: "#/components/schemas/Service" }
        commit:
          type: string
          nullable: true
          description: The build's VCS revision (Go build stamp), `-dirty` suffixed when the working tree was modified. NULL when the build carries no stamp — never guessed.
        proof_subject: { $ref: "#/components/schemas/ProofSubject" }
        live_subject: { $ref: "#/components/schemas/LiveSubject" }
        substrate:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/SubstrateRef" }]
          description: Null when no batch is servable; `substrate_unavailable_reason` then says why.
        substrate_unavailable_reason: { type: string }
        feeds_registry: { $ref: "#/components/schemas/FeedsRegistry" }
        reconcile:
          nullable: true
          allOf: [{ $ref: "#/components/schemas/ReconcileSummary" }]
          description: Null when no committed receipt artifact is present in this deployment; `reconcile_unavailable_reason` then says so. Absent evidence is stated, never approximated.
        reconcile_unavailable_reason: { type: string }
        probe_records:
          type: array
          items: { $ref: "#/components/schemas/ProbeRecord" }
        notes:
          type: array
          items: { type: string }
