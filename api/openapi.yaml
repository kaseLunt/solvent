openapi: 3.0.3

# THIS FILE IS THE CONTRACT.
#
# `cmd/api`'s handlers are contract-tested against it (every response of every
# route, in the seeded suite), and `packages/client-ts` is generated from it.
# Where a handler and this file disagree, the disagreement is a FAILURE — not a
# documentation lag.
#
# Two conventions run through the whole document and are load-bearing:
#
#  1. EVERY MONEY QUANTITY IS A DECIMAL STRING, never a JSON number. Health
#     factors are 18-decimal integers, Aave base values 8-decimal, Debt Manager
#     USD 6-decimal; several are wider than an IEEE-754 double can carry
#     losslessly. A risk number that silently loses its low digits in a browser
#     is a wrong number wearing a plausible shape.
#  2. `additionalProperties: false` ON EVERY OBJECT. A contract test that admits
#     unknown fields cannot detect drift, and a client generated from a permissive
#     schema silently ignores the field that was added to tell it something.

info:
  title: Solvent Risk API
  version: "1.4.0"
  description: |
    A read-only public view of ether.fi lending risk across two engines: the Aave
    v3 ether.fi market (Ethereum) and the ether.fi Debt Manager (Optimism).

    ## What this service is, and is not

    It serves numbers materialized by `riskd` from durably custodied chain state.
    It makes **zero RPC calls**: every age is the database clock minus a durable
    stamp, so nothing here is measured against a chain head observed at request
    time, and nothing is measured against the server's wall clock.

    ## The two engines are never blended

    Aave publishes a continuous health factor in the pool's 8-decimal base
    currency. The Debt Manager publishes a strict `liquidatable` boolean over
    6-decimal USD, with no liquidation bonus in the health test. Every aggregate
    is per engine, states its own `value_decimals`, and is never summed across
    engines.

    ## Refusals are rows, not errors

    When an input cannot honestly value a position, the position is served as a
    **refused row naming its reason** and is counted in every containing
    aggregate's refusal count. A whole-engine refusal serves as refused rows for
    that engine while the other engine serves normally. This surface never omits
    a position it could not compute.

    ## Superseded batches are still served

    A batch is flagged `superseded` when any of three legs fires against a live
    read of the cursor and epoch tables. At this grade the flag is the contract:
    the batch is served with it, and it heals at the next materializer pass.

    ## Freshness is per input, against that input's own budget

    Every served number carries the full snapshot of every price input behind it —
    value, decimals, block, chain-asserted as-of, source, provenance class,
    budget and verdict — as **persisted by the batch**. Nothing is re-read or
    re-judged at request time: a poll superseding a price key between the batch
    and this request must not change what the batch is disclosed to have used.

    Database insert time is never substituted for a chain-asserted as-of. An
    input with no as-of is refused rather than dated from when it was stored.
  license:
    name: See repository LICENSE

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: book
  - name: address
  - name: observatory
  - name: stream
  - name: meta
  - name: events
  - name: params
  - name: prices
  - name: scenarios
  - name: evidence
  - name: batches

paths:
  /v1/book:
    get:
      tags: [book]
      operationId: getBook
      summary: Book-wide aggregates, the health-factor histogram and the liquidation waterfall
      description: |
        Per-engine aggregates with named refusal and flag breakdowns, a
        health-factor histogram bucketed on each engine's OWN comparator, and a
        single-factor down-grid waterfall whose first point is the UNSHOCKED book
        (which is where the standing bad-debt census comes from).
      responses:
        "200":
          description: The newest servable batch's book.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookResponse" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/NoBatch" }

  /v1/positions:
    get:
      tags: [book]
      operationId: getPositions
      summary: The position table — cursor-paginated, batch-stable, one engine at a time
      description: |
        A page of the requested ENGINE's book, drawn entirely from ONE batch.

        The response pins the batch every row came from, and `next_cursor` is
        BOUND to that batch: it encodes (batch id, rank) opaquely, and a client
        must treat it as a token, not a structure. When the pinned batch is no
        longer the newest servable batch, presenting its cursor answers **409
        `batch_superseded`** and the client restarts from page one — an honest
        restart, never a page silently mixing two materializations.

        Engines are never blended, so `engine` is REQUIRED: a single ranked list
        over two comparators (Aave's wad vs the Debt Manager's strict boolean)
        would be a cross-engine ordering this service refuses to invent.

        Refused rows are ROWS here, exactly as they are in the aggregates:
        filtering them out would un-count the positions the book could not
        honestly value.

        Rows are the LEAN `PositionSummary` (AMENDMENT 1/E): the ranked
        page's own fields — status, refusal, health factor, verdict, totals,
        boundary distance, as-of marks — without the per-leg and per-price
        fan-out. The FULL `Position` (legs, price inputs, liquidation-price
        solve, per-input provenance) stays on `/v1/address/{addr}`.
      parameters:
        - name: engine
          in: query
          required: true
          description: Which engine's book to page. The two books are never blended into one ranking.
          schema:
            type: string
            enum: [aave_v3_etherfi, debt_manager]
        - name: cursor
          in: query
          required: false
          description: |
            The `next_cursor` of the previous page, verbatim. OPAQUE — it
            encodes (batch id, rank) and is bound to the batch AND the exact
            query that minted it: (engine, sort, dir, min_value). A cursor
            whose batch has been superseded answers 409 rather than a
            mixed-batch page; a cursor presented under a different (engine,
            sort, dir, min_value) than it was minted for is a 400 — replaying
            a rank into a different ranking would silently serve garbage. A
            malformed cursor is a 400.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 50.
          schema: { type: integer, minimum: 1, maximum: 1000 }
        - name: sort
          in: query
          required: false
          description: |
            Ranking within the engine's own comparator. Defaults to
            `liq_distance` — nearest to its OWN engine's liquidation boundary
            first. Ties break on (account) so the order is total and the cursor
            deterministic.
          schema:
            type: string
            enum: [liq_distance, debt, hf, status]
        - name: dir
          in: query
          required: false
          description: |
            Ranking direction. ABSENT means the sort's own CANONICAL direction,
            which this contract states explicitly: `liq_distance` → asc
            (nearest to the boundary first), `debt` → desc (largest debt
            first), `hf` → asc (lowest health factor first), `status` →
            refused-first (desc on the refused axis). The non-canonical
            direction serves the EXACT REVERSE of the canonical ranking —
            except the account tie-break, which ALWAYS ranks ascending, so
            equal sort keys order identically in both directions and the
            cursor stays deterministic.
          schema:
            type: string
            enum: [asc, desc]
        - name: min_value
          in: query
          required: false
          description: |
            Position-size floor, a decimal integer string in the ENGINE'S OWN
            value unit at its `value_decimals` (Aave base-currency 8, Debt
            Manager USD 6 — the same unit as the row's `total_collateral` /
            `total_debt` pair). THE EXCLUSION LAW: a row is excluded iff
            `status = computed` AND both totals are non-null AND
            max(total_collateral, total_debt) < min_value. REFUSED rows and
            rows with a NULL total are NEVER excluded — an unknowable is not a
            small number, and a size filter that hid refusals would un-count
            the positions the book could not honestly value. When `min_value`
            is present, `total_positions` counts QUALIFYING rows only (it is
            this walk's denominator); the UNFILTERED engine total remains
            `aggregate.positions` on `/v1/book`.
          schema:
            type: string
            pattern: "^[0-9]+$"
      responses:
        "200":
          description: One batch-stable page of the engine's book.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PositionsResponse" }
              example:
                served_at: "2026-07-29T10:00:05Z"
                batch:
                  id: 1
                  computed_at: "2026-07-29T10:00:00Z"
                  age_seconds: 5
                  producer: "riskd"
                  status: "complete"
                  position_count: 4
                  refused_count: 2
                  refused_engines: []
                  flagged_count: 1
                  watermarks:
                    - engine: "aave_v3_etherfi"
                      chain_id: 1
                      last_block: 25635618
                      acked_epoch: 0
                      max_epoch_at_compute: 0
                      sweep: null
                    - engine: "debt_manager"
                      chain_id: 10
                      last_block: 154796552
                      acked_epoch: 0
                      max_epoch_at_compute: 0
                      sweep:
                        rows: 3
                        failed: 1
                        success_sum: "309593004"
                        max_updated_at: "2026-07-29T09:40:00Z"
                        age_seconds: 1200
                        generation: 4
                        generation_open: false
                  supersession:
                    superseded: false
                    legs: []
                    note: "a superseded batch is still served: the flag is the contract and it heals at the next materializer pass."
                engine: "aave_v3_etherfi"
                sort: "liq_distance"
                limit: 1
                refused: false
                refusal: null
                total_positions: 2
                positions:
                  - engine: "aave_v3_etherfi"
                    account: "0xAAaA000000000000000000000000000000000001"
                    status: "computed"
                    value_decimals: 8
                    refusal: null
                    flags: ["stale_price"]
                    health_factor:
                      wad: "1080000000000000000"
                      num: "6480000000000000"
                      den: "6000000000000000"
                      infinite: false
                      note: "compare against 1e18 ON THE WAD; do not re-derive a float from num/den to decide eligibility."
                    liquidatable: null
                    total_collateral: "800000000000"
                    total_debt: "600000000000"
                    liq_distance:
                      kind: "distance"
                      scale_factor_num: "6000000000000000"
                      scale_factor_den: "6480000000000000"
                      factor_asset: "0xCd5fE23C85820F7B72D0926FC9b05b43E359b7ee"
                      factor_symbol: "weETH"
                      reason: null
                    balances_block: 25635618
                    params_block: 25635600
                    sweep_block: 0
                next_cursor: "MS5saXFfZGlzdGFuY2UuMQ"
                notes:
                  - "every row on this page was drawn from batch 1; `next_cursor` is bound to that batch and answers 409 once it is superseded as the newest servable batch."
                  - "refused rows are ROWS: they stay on the page, named, and counted."
                  - "rows are the lean PositionSummary; the FULL Position (legs, price inputs, liquidation-price solve) is served by /v1/address/{addr}."
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/BatchSuperseded" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/NoBatch" }

  /v1/address/{addr}:
    get:
      tags: [address]
      operationId: getAddress
      summary: One address's per-engine positions, with as-ofs and per-input price disclosures
      parameters:
        - $ref: "#/components/parameters/Addr"
      responses:
        "200":
          description: |
            The address's positions in the newest servable batch. An address with
            no position answers 200 with `found: false` — "no position in this
            batch" is an ANSWER, and it arrives with the batch that answered it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AddressResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/NoBatch" }

  /v1/address/{addr}/stress:
    get:
      tags: [address]
      operationId: getAddressStress
      summary: The committed scenario set evaluated against one address
      description: |
        Every scenario in the committed set, evaluated from THIS BATCH's persisted
        rows so the results describe the same materialization as `/v1/book`.
        Shocks are applied to primitive axes and propagated through each engine's
        actual pricing transforms; assets the propagation matrix does not cover
        are named in `held_flat` rather than silently held at their pre-shock
        price.
      parameters:
        - $ref: "#/components/parameters/Addr"
      responses:
        "200":
          description: Scenario results, with the scenario config version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StressResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/NoBatch" }

  /v1/address/{addr}/history:
    get:
      tags: [address]
      operationId: getAddressHistory
      summary: One address's health factor, totals and refusals across retained batches
      description: |
        Per-batch points for one address, newest batch first, one series per
        engine. Every point is a PERSISTED row from a retained batch — nothing
        is recomputed for this response, so the history is exactly what was
        served at the time, including the batches that REFUSED the position.

        `found` carries the same three-valued contract as `/v1/address`, and a
        withheld engine leaves a NAMED hole: a batch in which an engine's whole
        book was withheld has no row for any account on that engine, so such
        batches are listed per series in `withheld_batch_ids` — a missing point
        there means "could not be established at that batch", never "no
        position at that batch".
      parameters:
        - $ref: "#/components/parameters/Addr"
        - name: limit
          in: query
          required: false
          description: Number of retained batches to cover, newest first. Defaults to 100.
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: The address's per-engine history across retained batches.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AddressHistoryResponse" }
              example:
                served_at: "2026-07-29T10:00:05Z"
                batch:
                  id: 2
                  computed_at: "2026-07-29T10:00:00Z"
                  age_seconds: 5
                  producer: "riskd"
                  status: "complete"
                  position_count: 4
                  refused_count: 2
                  refused_engines: []
                  flagged_count: 1
                  watermarks:
                    - engine: "aave_v3_etherfi"
                      chain_id: 1
                      last_block: 25635618
                      acked_epoch: 0
                      max_epoch_at_compute: 0
                      sweep: null
                  supersession:
                    superseded: false
                    legs: []
                    note: "evaluated against a live read of the cursor and epoch tables."
                address: "0xAAaA000000000000000000000000000000000001"
                limit: 100
                engines:
                  - engine: "aave_v3_etherfi"
                    value_decimals: 8
                    points:
                      - batch_id: 2
                        computed_at: "2026-07-29T10:00:00Z"
                        balances_block: 25635618
                        sweep_block: 0
                        status: "computed"
                        refusal: null
                        health_factor:
                          wad: "1080000000000000000"
                          num: "6480000000000000"
                          den: "6000000000000000"
                          infinite: false
                          note: "compare against 1e18 ON THE WAD."
                        liquidatable: null
                        total_collateral_base: "800000000000"
                        total_debt_base: "600000000000"
                      - batch_id: 1
                        computed_at: "2026-07-29T09:45:00Z"
                        balances_block: 25635540
                        sweep_block: 0
                        status: "refused"
                        refusal:
                          code: "G1"
                          detail: "weETH/aaveoracle price input missing at compute time"
                          note: "a refused batch is a POINT in this history, not a gap: the position existed and could not honestly be valued."
                        health_factor: null
                        liquidatable: null
                        total_collateral_base: null
                        total_debt_base: null
                    withheld_batch_ids: []
                    note: "points are persisted rows from retained batches, newest first; nothing is recomputed for this response."
                found: true
                lookup_complete: true
                withheld_engines: []
                lookup_complete_note: "every engine was available in the newest servable batch, so `found` is a definitive answer there; older points speak only for their own batches."
                notes:
                  - "retention bounds this history: batches outside the retention window are gone from this surface, and their absence is stated by `limit`, never rendered as a flat line."
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
        "503": { $ref: "#/components/responses/NoBatch" }

  /v1/observatory:
    get:
      tags: [observatory]
      operationId: getObservatory
      summary: Per-engine TVL, counts and rate indexes across recent batches
      parameters:
        - name: limit
          in: query
          required: false
          description: Number of batches to return, newest first.
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: The migration time series.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObservatoryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/observatory/series:
    get:
      tags: [observatory]
      operationId: getObservatorySeries
      summary: The durable per-engine rollup — debt, collateral, accounts and rates over time
      description: |
        Points from the `observatory_points` rollup, oldest first: per-engine
        aggregates captured on an hourly bucket so the migration record persists
        beyond the batch-retention window. Each point states what the engine's
        book looked like AT ITS BUCKET — a bucket captured while the engine's
        whole book was withheld carries null totals and names the refusal,
        never zeros.

        A `step_seconds` larger than the native bucket serves every Nth bucket
        VERBATIM. Nothing here is averaged, interpolated or smoothed: a served
        point is always an exact captured row.
      parameters:
        - name: engine
          in: query
          required: true
          schema:
            type: string
            enum: [aave_v3_etherfi, debt_manager]
        - name: from
          in: query
          required: false
          description: Inclusive lower bound on bucket start. Unbounded when absent.
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: Inclusive upper bound on bucket start. Unbounded when absent.
          schema: { type: string, format: date-time }
        - name: step
          in: query
          required: false
          description: |
            Stride in seconds. The rollup's native bucket is hourly (3600); a
            larger step serves every Nth captured bucket verbatim — never an
            average of the buckets it skips.
          schema: { type: integer, minimum: 3600 }
      responses:
        "200":
          description: The rollup series for one engine.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ObservatorySeriesResponse" }
              example:
                served_at: "2026-07-29T10:00:05Z"
                engine: "debt_manager"
                usd_decimals: 6
                from: "2026-07-29T08:00:00Z"
                to: null
                step_seconds: null
                points:
                  - bucket_start: "2026-07-29T08:00:00Z"
                    last_block: 154794000
                    batch_id: 41
                    materialization_key: "9a4a7c1de00b53219a6f2f41c86a77025f0b3e2a4c1d99e21b7a30e12cf5a2b9"
                    acked_epoch: 0
                    max_epoch_at_compute: 0
                    sweep_recorded: true
                    sweep:
                      rows: 3
                      failed: 1
                      success_sum: "464379000"
                      max_updated_at: "2026-07-29T07:58:40Z"
                      age_seconds: 7285
                      generation: 12
                      generation_open: false
                    refused: false
                    refusal_code: null
                    accounts: 3
                    refused_positions: 1
                    liquidatable_positions: 1
                    debt_usd: "309593004"
                    collateral_usd: "412790672"
                    rates:
                      - engine: "debt_manager"
                        asset: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
                        symbol: "USDC"
                        kind: "borrow_index"
                        scale: "index-1e18"
                        value: "1050000000000000000"
                        as_of_block: 154793990
                        note: "as of its OWN last update, which can trail the bucket."
                  - bucket_start: "2026-07-29T09:00:00Z"
                    last_block: 154796552
                    batch_id: 42
                    materialization_key: "e2a4c1d99e21b7a30e12cf5a2b9a4a7c1de00b53219a6f2f41c86a77025f0b3"
                    acked_epoch: 0
                    max_epoch_at_compute: 0
                    sweep_recorded: true
                    sweep:
                      rows: 3
                      failed: 1
                      success_sum: "464379000"
                      max_updated_at: "2026-07-29T08:58:40Z"
                      age_seconds: 3685
                      generation: 13
                      generation_open: true
                    refused: true
                    refusal_code: "FLAG_CUSTODY_UNPROVEN"
                    accounts: null
                    refused_positions: 0
                    liquidatable_positions: null
                    debt_usd: null
                    collateral_usd: null
                    rates: []
                notes:
                  - "a withheld bucket carries NULL totals and names its refusal code: a rollup that rendered an unproven book as zero debt would fabricate the exact reassurance this surface exists to withhold."
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /v1/events:
    get:
      tags: [events]
      operationId: getEvents
      summary: The durable chain-action feed — borrows, repays, supplies, withdrawals, liquidations
      description: |
        A cursor-paginated read of `position_events` — durably custodied,
        reorg-aware chain actions, NEVER invented events.

        THE TWO-MODE ORDERING LAW: block heights are incomparable ACROSS
        chains (ETH ~25.6M and OP ~154M say nothing about time relative to
        each other), so ordering depends on the request's scope:

          * an ENGINE-SCOPED page (`engine` names exactly one engine, hence
            one chain) is ordered (block_number, tx_hash, log_index, seq)
            DESC — heights are comparable within one chain; exact and
            complete.
          * a CROSS-ENGINE page (no `engine`) is ordered by custodied
            `block_time` DESC with the deterministic chain-aware tiebreak
            (chain_id, block_number, tx_hash, log_index, seq) DESC; rows
            WITHOUT a custodied block_time sort AFTER every timed row in a
            DISCLOSED untimed tail — never interleaved by incomparable
            heights, never given an invented time. The tail's internal order
            is the tiebreak alone, NOT chronology.

        Header custody can land between two pages of one cross-engine walk,
        promoting a row from the untimed tail into the timed section: each
        page is internally exact, but the feed is a live surface, not a
        pinned batch.

        `since_block` is meaningful ONLY engine-scoped: a height bound across
        two chains with incomparable heights means nothing, and a
        cross-engine request carrying it is refused with 400.

        `type` is the closed DISPLAY vocabulary; `raw_type` is the engine's own
        event name, verbatim. Every raw event type either maps to a display
        type or is EXPLICITLY excluded from this feed with its reason recorded
        (see `EventDisplayType`); parameter-change events are served by
        `/v1/params`, not here. That mapping is total and welded to the closed
        per-engine type sets — an unmapped event type is a service failure,
        not a silent omission.

        `amount` is the engine's own CUSTODIED accounting delta, verbatim, and
        `amount_unit` names its closed semantic unit — it is NOT a
        display-ready token amount (see `EventAmountUnit`).

        `block_time` is the header time of the event's block under block-header
        custody. It is NULL until the header is custodied — NEVER fabricated,
        never substituted with a database clock. Render the block number when
        it is null.
      parameters:
        - name: cursor
          in: query
          required: false
          description: The `next_cursor` of the previous page, verbatim. OPAQUE. A malformed cursor is a 400.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: Page size. Defaults to 50.
          schema: { type: integer, minimum: 1, maximum: 200 }
        - name: engine
          in: query
          required: false
          schema:
            type: string
            enum: [aave_v3_etherfi, debt_manager]
        - name: account
          in: query
          required: false
          description: Restrict to one account's own actions.
          schema:
            type: string
            pattern: "^0[xX][0-9a-fA-F]{40}$"
        - name: types
          in: query
          required: false
          description: Display-vocabulary filter, comma-separated. Absent means every display type.
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: "#/components/schemas/EventDisplayType" }
        - name: since_block
          in: query
          required: false
          description: |
            Inclusive lower bound on block_number. ENGINE-SCOPED ONLY: it
            requires `engine`, because a height bound across two chains with
            incomparable heights is meaningless. A cross-engine request
            carrying it is a 400, never a silently misapplied filter.
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: One page of the feed.
          content:
