                    effective_block: 25635600
                    effective_log_index: 12
                    source_event: "CollateralConfigurationChanged"
                    tx_hash: "0x2b8a1f0e6c33269e9d8f01d1db494ca4cf693c99377f78f9628c1b74d5a1a859"
