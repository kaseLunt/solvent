  /v1/scenarios/run-book-set:
    post:
      tags: [scenarios]
      operationId: runBookSet
      summary: N committed scenarios evaluated against ONE resolved batch
      description: |
        ADDED 1.7.0, additive. The named committed scenarios — the same set
        `GET /v1/scenarios` publishes — evaluated against a SINGLE batch,
        resolved once inside one database snapshot before any arithmetic runs.

        The point is not speed, though it is roughly two to three times faster
        than the same ids fetched one at a time. The point is that a
        cross-scenario comparison is TRUE BY THE SHAPE OF THIS RESPONSE: one
        batch, one census, one envelope, N results. A serial sweep of the
        committed set takes about as long as the interval between
        materializations, so it straddles a batch boundary roughly half the
        time — and a comparison assembled from bodies measured on two different
        books is not the comparison that was asked for.

        ALL OR NOTHING. There is no partial 200 and no per-scenario refusal
        register. An id this deployment does not publish, a duplicate, a
        malformed id or an over-cap set refuses the WHOLE request before any
        batch read, naming every offender; any arithmetic refusal is a 500 for
        the whole set. In a 200, `requested_scenario_ids` and
        `results[].scenario_id` are the same multiset, which is the strongest
        membership law available: one line to check, impossible to satisfy
        while hiding a hole.

        WHAT IT DOES NOT CARRY. This is a SUMMARY: no histograms, no
        `collateral_by_asset`, no `movers`, no `held_flat` values, no
        `out_of_model`. Drill-down is `POST /v1/scenarios/{id}/run-book`'s job.
        `out_of_model` in particular is published verbatim and versioned on
        `GET /v1/scenarios`, and `scenario_id` + `scenario_version` +
        `scenario_config_version` make that join exact — reading a shocked
        number without it is reading it wrong.

        WHAT IT DOES CARRY, AND WHY. Every zero on this surface carries a
        published cause. Three committed scenarios produce all-zero deltas for
        three DIFFERENT reasons — an oracle snap band that swallowed the move, a
        definition that declared all its shocks at the identity factor 1/1, and
        a projection that ran no spot pass at all — and without `shock_reach`
        all three render as the same three zero-length bars. An engine with
        nothing measurable is a NAMED ABSENCE in `unmeasurable_engines` rather
        than a row of zeros with a `"0"` denominator. The movement count carries
        its own denominator, because `hf_dropped_accounts: 0` beside
        `accounts: 46` reads as "no health factor dropped" when the truth can be
        "44 of the 46 carry no health factor to drop".

        COST AND CONCURRENCY. The limiter is charged one token per scenario
        (`set_run_token_cost_per_scenario` on `/v1/meta`), 1 in the middleware
        and the remainder in the handler after validation, so a malformed or
        unknown-id request costs one token rather than N. At most
        `max_inflight_set_runs` evaluations run at once; the overflow is refused
        IMMEDIATELY with 503 `set_run_busy` rather than queued.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SetRunRequest" }
            example:
              scenario_ids: ["eth_minus_30", "stable_depeg_0995_in_band", "dm_composition_census"]
      responses:
        "200":
          description: One batch, N results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunBookSetResponse" }
              example:
                batch:
                  age_seconds: 5
                  computed_at: "2026-07-29T10:00:00Z"
                  flagged_count: 1
                  id: 1
                  position_count: 4
                  producer: "riskd"
                  refused_count: 2
